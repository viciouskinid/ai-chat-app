<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://js.puter.com; connect-src 'self' https://api.puter.com https://js.puter.com https://*.puter.com wss://api.puter.com wss://*.puter.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://js.puter.com https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: blob:; frame-src 'self' data: blob:; child-src 'self' data: blob:;">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Chat · Puter</title>
<style>
:root{
  --bg:#faf9f5;--surface-0:#ffffff;--surface-1:#f5f4ee;--surface-2:#ecebe3;--surface-3:#e4e2d7;
  --text-primary:#1a1a1a;--text-secondary:#5c5a54;--text-muted:#9a978e;
  --border:#e5e3d9;--border-strong:#d6d3c6;--accent:#d97757;--accent-hover:#c96647;
  --user-bubble:#f0eee6;--code-bg:#f7f6f0;--code-border:#e0ddd2;
  --font-ui:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-serif:Georgia,'Times New Roman',serif;
  --font-mono:'SF Mono','Consolas','Courier New',monospace;
  --radius:12px;--radius-sm:8px;--radius-lg:20px;
  --sidebar-w:270px;--sidepanel-w:460px;
}
[data-theme="dark"]{
  --bg:#1a1915;--surface-0:#22211d;--surface-1:#2a2924;--surface-2:#35332c;--surface-3:#3f3d35;
  --text-primary:#f0eee6;--text-secondary:#b8b5a8;--text-muted:#7d7a6e;
  --border:#3a3830;--border-strong:#4a4840;--accent:#d97757;--accent-hover:#e88a6c;
  --user-bubble:#35332c;--code-bg:#1e1d19;--code-border:#3a3830;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text-primary);min-height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:center;padding:16px;transition:background .2s,color .2s}
.app-layout{display:flex;width:100%;max-width:1500px;height:92vh;background:var(--surface-0);border-radius:var(--radius-lg);box-shadow:0 4px 24px rgba(0,0,0,.06);overflow:hidden;border:1px solid var(--border);position:relative;flex-direction:column}
.banner{display:none;padding:10px 16px;background:var(--danger,#c0392b);color:#fff;font-size:.82rem;text-align:center;font-weight:500}
.banner.visible{display:block}
.loading-banner{display:none;padding:8px 16px;background:var(--surface-2);color:var(--text-secondary);font-size:.8rem;text-align:center;border-bottom:1px solid var(--border)}
.loading-banner.visible{display:block}
.loading-banner .spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.main-row{display:flex;flex:1;min-height:0;position:relative}
/* Sidebar */
.sidebar{width:var(--sidebar-w);background:var(--surface-1);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:width .15s ease}
.sidebar.hidden{width:0;border-right:none}
.sidebar-header{padding:16px 12px 8px;display:flex;justify-content:space-between;align-items:center}
.brand{font-family:var(--font-serif);font-size:1.3rem;font-weight:500;letter-spacing:-.02em}
.sidebar-header button{background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--text-muted);padding:4px;border-radius:6px}
.sidebar-header button:hover{background:var(--surface-2)}
.sidebar-rows{padding:0 8px 8px;display:flex;flex-direction:column;gap:2px}
.side-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:.88rem;color:var(--text-secondary);background:none;border:none;text-align:left;width:100%;transition:background .15s}
.side-row:hover{background:var(--surface-2);color:var(--text-primary)}
.side-row svg{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-row .shortcut{margin-left:auto;font-size:.68rem;color:var(--text-muted);opacity:0;transition:opacity .15s}
.side-row:hover .shortcut{opacity:1}
.history-list{flex:1;overflow-y:auto;padding:4px 8px 8px}
.history-section-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);padding:12px 10px 4px}
.history-item{padding:8px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:.85rem;color:var(--text-secondary);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s}
.history-item:hover{background:var(--surface-2)}
.history-item.active{background:var(--surface-3);color:var(--text-primary);font-weight:500}
.history-meta{font-size:.66rem;color:var(--text-muted);margin-top:2px;font-variant-numeric:tabular-nums}
.resizer{width:5px;background:transparent;cursor:col-resize;flex-shrink:0;position:relative;z-index:5;transition:background .15s}
.resizer:hover,.resizer.dragging{background:var(--accent);opacity:.5}
/* Chat */
.chat-container{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--surface-1);border-bottom:1px solid var(--border);gap:12px}
.top-bar button{background:none;border:none;font-size:.85rem;color:var(--text-secondary);cursor:pointer;padding:4px 10px;border-radius:6px;transition:background .15s}
.top-bar button:hover{background:var(--surface-2)}
.top-bar button.hidden{display:none}
.usage-bar{display:flex;gap:14px;align-items:center;font-size:.78rem;color:var(--text-muted);flex-wrap:wrap}
.usage-bar b{color:var(--text-secondary);font-weight:600}
.usage-bar .err{color:#c0392b;font-weight:600}
.chat-messages{flex:1;padding:28px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;background:var(--bg);position:relative}
.welcome{text-align:center;color:var(--text-muted);margin:auto;padding:40px}
.welcome h1{font-family:var(--font-serif);font-weight:400;font-size:2.2rem;margin-bottom:8px;color:var(--text-primary)}
.welcome p{font-size:1rem;color:var(--text-secondary)}
.message{max-width:82%;padding:14px 18px;border-radius:var(--radius);line-height:1.6;font-size:.95rem}
.user-message{background:var(--user-bubble);align-self:flex-end;border-bottom-right-radius:4px}
.ai-message{background:var(--surface-0);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px;width:82%}
.ai-message.error{border-color:#c0392b}
.message-sender{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);margin-bottom:6px;font-family:var(--font-mono)}
.message-content{white-space:pre-wrap;word-break:break-word}
.reasoning{margin:8px 0;border:1px solid var(--border);border-radius:8px;background:var(--surface-1);overflow:hidden}
.reasoning summary{padding:6px 12px;font-size:.75rem;color:var(--text-secondary);cursor:pointer;user-select:none;background:var(--surface-2)}
.reasoning pre{padding:10px 12px;font-family:var(--font-mono);font-size:.78rem;line-height:1.5;color:var(--text-primary);white-space:pre-wrap;max-height:220px;overflow:auto}
.code-block{margin:10px 0;border:1px solid var(--code-border);border-radius:8px;overflow:hidden;background:var(--code-bg)}
.code-block-header{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--surface-2);font-size:.72rem;color:var(--text-secondary);border-bottom:1px solid var(--code-border)}
.code-block-header button{background:none;border:none;font-size:.72rem;color:var(--accent);cursor:pointer;text-decoration:underline}
.code-block pre{margin:0;padding:12px;overflow-x:auto;font-family:var(--font-mono);font-size:.8rem;line-height:1.5;color:var(--text-primary)}
.msg-meta{margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.7rem;color:var(--text-muted);font-variant-numeric:tabular-nums;border-top:1px solid var(--border);padding-top:8px;flex-wrap:wrap}
.msg-meta button{background:none;border:none;font-size:.7rem;color:var(--accent);cursor:pointer;text-decoration:underline;padding:0}
.quota-delta{color:var(--accent);font-weight:600}
.scroll-helper{position:absolute;left:50%;transform:translateX(-50%);bottom:20px;width:36px;height:36px;border-radius:50%;background:var(--surface-0);border:1px solid var(--border-strong);box-shadow:0 2px 8px rgba(0,0,0,.1);display:none;align-items:center;justify-content:center;cursor:pointer;z-index:10;color:var(--text-secondary)}
.scroll-helper.visible{display:flex}
.scroll-helper:hover{background:var(--surface-2)}
/* Composer */
.composer{padding:12px 24px 16px;background:var(--surface-0);border-top:1px solid var(--border)}
.attachments{display:none;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.attachments.active{display:flex}
.attachment-tile{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:8px;font-size:.78rem;max-width:220px}
.attachment-tile .icon{width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#418CFF;border-radius:5px;color:#fff;font-size:.6rem;font-weight:700}
.attachment-tile .info{flex:1;min-width:0}
.attachment-tile .name{color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attachment-tile .size{font-size:.65rem;color:var(--text-muted)}
.attachment-tile .remove{background:none;border:none;font-size:1rem;cursor:pointer;color:var(--text-muted);padding:0 2px}
.attachment-tile .remove:hover{color:var(--accent)}
.composer-box{background:var(--surface-1);border:1px solid var(--border-strong);border-radius:var(--radius-lg);padding:10px 12px 6px;transition:border-color .2s,box-shadow .2s}
.composer-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,119,87,.12)}
#chatInput{width:100%;background:transparent;border:none;outline:none;font-family:var(--font-ui);font-size:.95rem;line-height:1.5;color:var(--text-primary);resize:none;min-height:24px;max-height:200px;padding:4px 6px}
#chatInput::placeholder{color:var(--text-muted)}
.composer-chin{display:flex;justify-content:space-between;align-items:center;padding-top:6px;margin-top:4px;border-top:1px solid var(--border)}
.chin-left{display:flex;align-items:center;gap:8px;min-width:0}
.chin-left.hidden{display:none}
.chin-right{display:flex;align-items:center;gap:8px}
.model-select{background:transparent;border:none;font-size:.8rem;color:var(--text-secondary);cursor:pointer;padding:4px 6px;border-radius:6px;outline:none;max-width:170px}
.model-select:hover{background:var(--surface-2)}
.send-btn{background:var(--accent);color:#fff;border:none;padding:7px 18px;border-radius:20px;font-size:.85rem;font-weight:500;cursor:pointer;transition:background .15s,opacity .15s}
.send-btn:hover:not(:disabled){background:var(--accent-hover)}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.streaming{display:none;text-align:center;color:var(--text-muted);font-size:.8rem;margin-top:8px}
.streaming.active{display:block}
.build-status{text-align:center;padding-top:8px;font-size:.7rem;color:var(--text-muted);font-variant-numeric:tabular-nums}
/* Side panel */
.side-panel{width:var(--sidepanel-w);background:var(--surface-1);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:width .15s ease}
.side-panel.hidden{width:0;border-left:none}
.side-panel-header{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface-1);flex-wrap:wrap}
.segmented{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:2px;flex-shrink:0}
.segmented button{background:none;border:none;padding:5px 10px;border-radius:6px;font-size:.78rem;color:var(--text-secondary);cursor:pointer}
.segmented button.active{background:var(--surface-0);color:var(--text-primary);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.side-title{flex:1;min-width:120px;font-size:.8rem;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.side-title b{color:var(--text-primary);font-weight:500}
.side-title .sep{opacity:.5;margin:0 4px}
.side-actions{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap}
.side-actions button{background:none;border:none;font-size:.78rem;color:var(--text-secondary);cursor:pointer;padding:4px 8px;border-radius:6px}
.side-actions button:hover{background:var(--surface-2);color:var(--text-primary)}
.side-actions .primary{color:var(--accent);text-decoration:underline}
.side-close{font-size:1.1rem;padding:2px 8px;color:var(--text-muted);background:none;border:none;cursor:pointer;border-radius:6px;line-height:1}
.side-close:hover{background:var(--surface-2);color:var(--text-primary)}
.side-body{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--surface-0)}
.side-tab{flex:1;display:flex;flex-direction:column;overflow:hidden}
.side-tab[hidden]{display:none}
.preview-frame{flex:1;border:none;background:#fff;width:100%;height:100%}
.code-preview{flex:1;padding:16px;overflow:auto;font-family:var(--font-mono);font-size:.78rem;line-height:1.5;background:var(--code-bg);white-space:pre-wrap;word-break:break-all}
.raw-viewer,.log-viewer,.settings-viewer{flex:1;padding:16px;overflow:auto;font-family:var(--font-ui);font-size:.82rem;line-height:1.6;color:var(--text-primary);background:var(--surface-0)}
.raw-viewer h4,.log-viewer h4,.settings-viewer h4{font-family:var(--font-ui);font-size:.78rem;margin:14px 0 6px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px}
.raw-viewer .chunk,.log-viewer .entry{background:var(--surface-2);border-radius:4px;padding:6px 8px;margin:4px 0;border-left:2px solid var(--accent);font-family:var(--font-mono);font-size:.72rem;white-space:pre-wrap;word-break:break-word}
.log-viewer .entry.ok{border-left-color:#2e7d32}
.log-viewer .entry.warn{border-left-color:#e67e22}
.log-viewer .entry.err{border-left-color:#c0392b}
.log-viewer .entry .meta{display:flex;justify-content:space-between;font-size:.66rem;color:var(--text-muted);margin-bottom:4px}
.settings-viewer details{border:1px solid var(--border);border-radius:6px;padding:6px 10px;margin:6px 0;background:var(--surface-1)}
.settings-viewer summary{cursor:pointer;font-size:.82rem;color:var(--text-primary)}
.settings-viewer .k{color:var(--text-muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.4px}
.settings-viewer .v{font-family:var(--font-mono);font-size:.78rem;word-break:break-all}
/* Modal */
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:center;justify-content:center}
.modal-backdrop.open{display:flex}
.modal{background:var(--surface-0);border:1px solid var(--border);border-radius:12px;max-width:640px;width:90%;max-height:80vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:1rem;font-weight:600}
.modal-body{padding:18px;overflow:auto}
.modal-body h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text-secondary);margin:14px 0 6px}
.modal-body .row{font-size:.82rem;margin:4px 0}
.modal-body .row b{color:var(--text-primary)}
@media(max-width:900px){.sidebar{display:none}.side-panel{width:340px}.resizer{display:none}}
@media(max-width:600px){body{padding:0}.app-layout{height:100vh;border-radius:0;border:none}.side-panel{display:none}.message{max-width:92%}.ai-message{width:92%}}
</style>
</head>
<body>
<div class="app-layout">
  <div class="loading-banner" id="loadingBanner"><span class="spinner"></span><span id="loadingText">Connecting to Puter…</span></div>
  <div class="banner" id="banner"></div>
  <div class="main-row">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><div class="brand">Chat</div><button id="toggleThemeBtn" title="Toggle theme">🌓</button></div>
      <div class="sidebar-rows">
        <button class="side-row" id="newChatRow">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <span>New</span><span class="shortcut">Ctrl+Shift+O</span>
        </button>
        <button class="side-row" id="searchRow">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>Search</span><span class="shortcut">Ctrl+K</span>
        </button>
      </div>
      <div class="history-section-label">Chats</div>
      <div class="history-list" id="historyList"></div>
    </aside>
    <div class="resizer" id="leftResizer" title="Drag to resize sidebar"></div>

    <div class="chat-container">
      <div class="top-bar">
        <button id="toggleSidebarBtn" title="Toggle History">☰</button>
        <div class="usage-bar" id="usageBar">
          <span id="usageText">Usage loading…</span>
          <span id="totalUsage" title="Total tokens used across all chats">Σ <b>0</b> tok · <b>$0.000000</b></span>
          <button id="refreshUsageBtn" title="Refresh Puter quota">↻</button>
          <button id="settingsBtn" title="Settings">⚙</button>
        </div>
        <div style="display:flex;gap:4px">
          <button id="toggleLogBtn" class="hidden" title="Show code panel">Code</button>
          <button id="toggleNetLogBtn" class="hidden" title="Show network log">Log</button>
        </div>
      </div>

      <main class="chat-messages" id="chatMessages">
        <div class="welcome" id="welcome"><h1>AI Chat</h1><p>How can I help you today?</p></div>
      </main>
      <button class="scroll-helper" id="scrollHelper" title="Scroll to bottom">↓</button>

      <footer class="composer">
        <div class="attachments" id="attachments"></div>
        <div class="composer-box">
          <textarea id="chatInput" placeholder="How can I help you today?" rows="1"></textarea>
          <div class="composer-chin">
            <div class="chin-left hidden" id="modelRow">
              <select id="providerSelect" class="model-select"><option value="">Provider…</option></select>
              <select id="modelSelect" class="model-select"><option value="">Model…</option></select>
            </div>
            <div class="chin-right"><button id="sendBtn" class="send-btn" disabled>Send</button></div>
          </div>
        </div>
        <div id="streamingIndicator" class="streaming">Thinking…</div>
        <div class="build-status"><span id="build" class="status-build"></span></div>
      </footer>
    </div>

    <div class="resizer" id="rightResizer" title="Drag to resize panel"></div>
    <aside class="side-panel hidden" id="sidePanel">
      <div class="side-panel-header">
        <div class="segmented" role="tablist" id="tabStrip"></div>
        <div class="side-title" id="sideTitle"></div>
        <div class="side-actions" id="sideActions">
          <button class="primary" id="copyBtn" title="Copy current tab contents">Copy</button>
          <button id="downloadBtn" title="Download file">⤓</button>
          <button id="diagnosticsBtn" title="Copy diagnostics (log + HTML)">Diag</button>
          <button class="side-close" id="closeSidePanelBtn" title="Close">×</button>
        </div>
      </div>
      <div class="side-body">
        <div class="side-tab" id="tab-preview" hidden><iframe class="preview-frame" id="previewFrame" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" referrerpolicy="no-referrer"></iframe></div>
        <div class="side-tab" id="tab-code" hidden><pre class="code-preview"><code id="codeContent"></code></pre></div>
        <div class="side-tab" id="tab-raw" hidden><div class="raw-viewer" id="rawViewer"></div></div>
        <div class="side-tab" id="tab-log" hidden><div class="log-viewer" id="logViewer"></div></div>
        <div class="side-tab" id="tab-settings" hidden><div class="settings-viewer" id="settingsViewer"></div></div>
      </div>
    </aside>
  </div>
</div>

<div class="modal-backdrop" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Settings · Account & Models</h2>
      <button class="side-close" id="closeSettingsBtn" title="Close">×</button>
    </div>
    <div class="modal-body" id="settingsModalBody"></div>
  </div>
</div>

<script>
/* ---------- BUILD STAMP ---------- */
(function () {
  const KEY = 'puter-build-meta';
  let prev = null;
  try { prev = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (_) {}
  let stamp, version = null, note = null, clockWorks = false;
  try {
    const now = new Date();
    if (now.getFullYear() < 2020) throw new Error('clock suspicious');
    const pad = n => String(n).padStart(2, '0');
    stamp = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    clockWorks = true;
  } catch (e) {
    stamp = 'unknown';
    version = (prev && prev.version ? prev.version : 0) + 1;
    note = 'AI had no clock access — version bumped.';
  }
  try { localStorage.setItem(KEY, JSON.stringify({ stamp, version, note, clockWorks })); } catch (_) {}
  document.addEventListener('DOMContentLoaded', () => {
    const el = document.getElementById('build');
    if (el) el.textContent = clockWorks ? `Build ${stamp}` : `Build ${stamp} · v${version} (${note})`;
  });
})();

/* ---------- NETWORK LOG ---------- */
window.__netLog = [];
(function(){
  const origFetch = window.fetch;
  window.fetch = async function(...args) {
    const start = performance.now();
    const url = typeof args[0] === 'string' ? args[0] : (args[0] && args[0].url) || String(args[0]);
    const method = (args[1] && args[1].method) || 'GET';
    let reqBody = '';
    try { reqBody = args[1] && args[1].body ? String(args[1].body).slice(0, 2000) : ''; } catch(_) {}
    const entry = { ts: new Date().toISOString(), method, url, reqBody, status: null, resBody: '', ms: null, error: null };
    window.__netLog.push(entry);
    try {
