  closeSearch() { this.$('searchOverlay').classList.remove('open'); }

  renderSearch() {
    const q = this.$('searchInput').value.trim();
    const ql = q.toLowerCase();
    const box = this.$('searchResults');
    const hits = [];
    const fmt = id => { const d = new Date(Number(id)); if (isNaN(d)) return ''; const pad = n => String(n).padStart(2, '0'); return d.toDateString() === new Date().toDateString() ? `${pad(d.getHours())}:${pad(d.getMinutes())}` : `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
    const mark = (text, at, len) => {
      const start = Math.max(0, at - 50), end = Math.min(text.length, at + len + 90);
      return (start > 0 ? '…' : '') + esc(text.slice(start, at)) + '<mark>' + esc(text.slice(at, at + len)) + '</mark>' + esc(text.slice(at + len, end)) + (end < text.length ? '…' : '');
    };
    Object.entries(this.chats).sort((a, b) => Number(b[0]) - Number(a[0])).forEach(([id, chat]) => {
      const title = chat.title || 'Untitled';
      if (!ql) {
        const m = chat.messages[0]; const t = m ? (m.display || m.content || '') : '';
        hits.push({ id, title, time: fmt(id), html: esc(t.slice(0, 160)) });
        return;
      }
      const ti = title.toLowerCase().indexOf(ql);
      if (ti >= 0) hits.push({ id, title, time: fmt(id), html: mark(title, ti, ql.length) });
      let n = 0;
      for (const m of chat.messages) {
        if (n >= 3) break;
        const t = (m.role === 'user' ? (m.display || m.content) : m.content) || '';
        const i = t.toLowerCase().indexOf(ql);
        if (i >= 0) { hits.push({ id, title, time: fmt(id), html: mark(t, i, ql.length) }); n++; }
      }
    });
    this._searchSel = 0;
    if (!hits.length) { box.innerHTML = `<div class="search-empty">${ql ? 'No results' : 'No chats yet'}</div>`; return; }
    box.innerHTML = hits.slice(0, 80).map((h, i) => `<div class="search-item ${i === 0 ? 'sel' : ''}" data-id="${esc(h.id)}"><div class="st"><span>${esc(h.title)}</span><span class="tm">${esc(h.time)}</span></div><div class="sn">${h.html}</div></div>`).join('');
    box.querySelectorAll('.search-item').forEach(el => el.addEventListener('click', () => { this.loadChat(el.dataset.id); this.closeSearch(); }));
  }

  updateSendState() {
    this.sendBtn.disabled = this.isProcessing || !this.signedIn ||
      (this.chatInput.value.trim() === '' && this.attachments.length === 0);
  }

  openTabs(tabs, active) {
    this.availableTabs = tabs;
    this.switchTab(active, true);
    this.sidePanel.classList.remove('hidden');
  }

  renderTabs() {
    this.tabStrip.innerHTML = '';
    this.availableTabs.forEach(t => {
      if (t === 'raw') {
        if (!this.rawMode) this.rawMode = 'raw';
        [['raw', 'Raw'], ['pretty', 'Pretty print']].forEach(([k, label]) => {
          const rb = document.createElement('button');
          rb.dataset.tab = 'raw'; rb.dataset.mode = k; rb.textContent = label;
          if (this.activeTab === 'raw' && this.rawMode === k) rb.classList.add('active');
          rb.addEventListener('click', () => { this.rawMode = k; this.switchTab('raw'); });
          this.tabStrip.appendChild(rb);
        });
        return;
      }
      const b = document.createElement('button');
      b.dataset.tab = t;
      b.textContent = t === 'raw' ? 'Response' : (t.charAt(0).toUpperCase() + t.slice(1));
      if (t === this.activeTab) b.classList.add('active');
      b.addEventListener('click', () => this.switchTab(t));
      this.tabStrip.appendChild(b);
    });
  }

  switchTab(t) {
    this.activeTab = t;
    this.renderTabs();
    ['preview','code','raw','log','settings'].forEach(n => { this.$('tab-' + n).hidden = t !== n; });
    if (t === 'raw') this.renderResponseViewer();
    if (t === 'log') this.renderLogViewer();
    if (t === 'settings') this.renderSettingsView();
    this.updateCopyLabel();
    this.updateSideTitle();
  }

  updateSideTitle() {
    if (this.activeTab === 'raw' && this.currentRaw) {
      this.sideTitle.innerHTML = `<b>${esc(this.currentRaw.model || 'Response')}</b>`;
    } else if (this.activeTab === 'log') {
      this.sideTitle.innerHTML = `<b>Debug log</b><span class="sep">·</span>${DebugLog.entries.length} entries`;
    } else if (this.activeTab === 'settings') {
      this.sideTitle.innerHTML = `<b>Settings</b>`;
    } else if (this.currentPanelState) {
      this.sideTitle.innerHTML = `<b>${esc(this.currentPanelState.fileName)}</b><span class="sep">·</span>${esc(this.currentPanelState.label || this.currentPanelState.lang)}`;
    } else this.sideTitle.innerHTML = '';
  }

  updateCopyLabel() {
    const map = { preview: 'Copy', code: 'Copy', raw: 'Copy', log: 'Copy Log', settings: 'Copy' };
    this.copyBtn.textContent = map[this.activeTab] || 'Copy';
  }

  async copyCurrent() {
    let text = '';
    if (this.activeTab === 'raw') text = this.currentRawView();
    else if (this.activeTab === 'log') text = this.formatLog();
    else if (this.activeTab === 'settings') text = this.settingsViewer.innerText;
    else if (this.activeTab === 'preview') text = (this.currentPanelState && this.currentPanelState.code) || '';
    else text = this.codeContent.textContent;
    try { await navigator.clipboard.writeText(text); this.copyBtn.textContent = 'Copied!'; }
    catch (_) { this.copyBtn.textContent = 'Copy failed'; }
    setTimeout(() => this.updateCopyLabel(), 1500);
  }

  downloadCurrent() {
    if (this.activeTab === 'log') return this.downloadReport();
    const s = this.currentPanelState; if (!s) return;
    const f = this.activeTab === 'code' && this.codeShown ? this.codeShown : { name: s.fileName, code: s.code };
    this.saveBlob(f.code, f.name, 'text/plain');
  }

  saveBlob(text, name, type) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: type || 'text/plain' }));
    a.download = name;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  formatLog() { return DebugLog.entries.length ? DebugLog.formatAll() : '(debug log is empty)'; }

  /* ---------- debug report ---------- */
  snapshotPageHTML() {
    const S = this.settings;
    const clone = document.documentElement.cloneNode(true);
    if (S.reportStripCode) {
      clone.querySelectorAll('script,style').forEach(n => {
        n.replaceWith(document.createComment(` ${n.tagName.toLowerCase()}${n.src ? ' src=' + n.src : ''}: ${(n.textContent || '').length} chars omitted `));
      });
    }
    const f = clone.querySelector('#previewFrame');
    if (f && S.reportPreview && f.hasAttribute('srcdoc')) f.setAttribute('srcdoc', '[see the Preview section of this report]');
    return '<!DOCTYPE html>\n' + clone.outerHTML;
  }

  renderedPreviewHTML() {
    if (!this.currentPanelState) return null;
    try {
      const d = this.previewFrame.contentDocument;
      if (!d || !d.documentElement) return '(preview document not available)';
      const c = d.documentElement.cloneNode(true);
      const hook = c.querySelector('#__dbg_capture'); if (hook) hook.remove();
      return '<!DOCTYPE html>\n' + c.outerHTML;
    } catch (err) { return `(preview DOM not accessible: ${err.message})`; }
  }

  buildReport() {
    const S = this.settings, D = DebugLog;
    const counts = {}; D.entries.forEach(e => { counts[e.type] = (counts[e.type] || 0) + 1; });
    const problems = D.entries.filter(e => this.entryClass(e) === 'err').slice(-15)
      .map(e => ({ id: e.id, ts: e.ts, type: e.type, what: e.name || e.url || e.level || '', status: e.status, error: e.error || e.text || undefined }));
    const r = {
      meta: {
        generatedAt: new Date().toISOString(), url: D.redactText(location.href), userAgent: navigator.userAgent,
        viewport: `${innerWidth}x${innerHeight}`, theme: document.documentElement.getAttribute('data-theme'),
        puterLoaded: this.puterReady(), signedIn: this.signedIn, selectedModel: this.modelSelect.value || null,
        build: (this.$('build') || {}).textContent || '', currentChatId: this.currentChatId, activeTab: this.activeTab
      },
      settings: Object.assign({}, S),
      summary: { totalEntries: D.entries.length, entryCounts: counts, recentProblems: problems },
      log: D.entries.slice(),
      quota: this.lastQuota || null
    };
    if (S.reportPageHTML) r.pageHTML = this.snapshotPageHTML();
    const st = this.currentPanelState;
    if (S.reportPreview && st) {
      r.preview = {
        files: st.files.map(f => st.bundle ? { name: f.name, lang: f.lang, chars: f.code.length } : { name: f.name, lang: f.lang, code: f.code }),
        sourceSentToPreview: this.previewSource || st.code,
        renderedHTML: this.renderedPreviewHTML()
      };
    }
    const strip = c => Object.assign({}, c, { messages: (c.messages || []).map(m => { const o = Object.assign({}, m); delete o.chunks; return o; }) });
    if (S.reportChats === 'all') r.chats = Object.fromEntries(Object.entries(this.chats).map(([k, c]) => [k, strip(c)]));
    else if (S.reportChats === 'current' && this.chats[this.currentChatId]) r.chats = { [this.currentChatId]: strip(this.chats[this.currentChatId]) };
    if (S.reportAccount) r.account = this.accountInfo;
    if (S.reportModels) r.models = this.allModels;
    return r;
  }

  formatReport(r) {
    if (this.settings.reportFormat === 'json') return JSON.stringify(r, null, 2);
    const F = '`'.repeat(5);
    const fence = (lang, body) => `${F}${lang}\n${body}\n${F}\n\n`;
    const json = v => JSON.stringify(v, null, 2);
    let s = `# AI Chat debug report\n\nGenerated ${r.meta.generatedAt}. Contains: environment, settings, summary, chronological log of calls and responses, and (if enabled) the rendered HTML of the preview website and of this app.\n\n`;
    s += `## Environment\n${fence('json', json(r.meta))}`;
    s += `## Settings\n${fence('json', json(r.settings))}`;
    s += `## Summary\n${fence('json', json(r.summary))}`;
    s += `## Log (oldest first, ${r.log.length} entries)\n${fence('text', r.log.length ? DebugLog.formatAll(r.log) : '(empty)')}`;
    if (r.preview) {
      s += `## Preview website\n`;
      r.preview.files.forEach(f => { s += f.code !== undefined ? `### Source file: ${f.name}\n${fence(f.lang || 'text', f.code)}` : `- Source file ${f.name} (${f.lang}, ${f.chars} chars, inlined in the page below)\n`; });
      s += `\n### Page as sent to the preview iframe\n${fence('html', r.preview.sourceSentToPreview)}`;
      s += `### Rendered DOM of the preview after it ran\n${fence('html', r.preview.renderedHTML || '(none)')}`;
    }
    if (r.pageHTML) s += `## Rendered HTML of this app\n${fence('html', r.pageHTML)}`;
    if (r.chats) s += `## Chats\n${fence('json', json(r.chats))}`;
    if (r.account) s += `## Account\n${fence('json', json(r.account))}`;
    if (r.quota) s += `## Quota\n${fence('json', json(r.quota))}`;
    if (r.models) s += `## Models\n${fence('json', json(r.models))}`;
    return s;
  }

  async copyReport(btn) {
    const label = btn ? btn.textContent : '';
    let text;
    try { text = this.formatReport(this.buildReport()); } catch (err) { text = 'Report generation failed: ' + (err && err.stack || err); }
    let msg = 'Copied!';
    try { await navigator.clipboard.writeText(text); } catch (_) { msg = 'Failed — use Download'; }
    DebugLog.event('report-copied', { chars: text.length, ok: msg === 'Copied!' });
    if (btn) { btn.textContent = msg; setTimeout(() => { btn.textContent = label; }, 1800); }
  }
  copyDiagnostics() { return this.copyReport(this.$('diagnosticsBtn')); }

  downloadReport() {
    const text = this.formatReport(this.buildReport());
    const ext = this.settings.reportFormat === 'json' ? 'json' : 'md';
    this.saveBlob(text, `ai-chat-debug-${new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19)}.${ext}`, 'text/plain');
    DebugLog.event('report-downloaded', { chars: text.length });
  }

  /* ---------- hooks ---------- */
  installHooks() {
    DebugLog.onChange = () => this.scheduleLogRender();
    window.addEventListener('message', ev => {
      try {
        if (ev.source !== this.previewFrame.contentWindow) return;
        const d = ev.data;
        if (!d || !d.__previewLog) return;
        DebugLog.add('preview', { level: String(d.level), text: DebugLog.txt(d.text) });
      } catch (_) {}
    });
    this.previewFrame.addEventListener('load', () => {
      if (this.currentPanelState) DebugLog.add('preview', { level: 'info', text: 'preview iframe loaded' });
    });
    this.logViewer.addEventListener('toggle', ev => {
      const d = ev.target;
      if (d && d.dataset && d.dataset.k) { if (d.open) this.openLog.add(d.dataset.k); else this.openLog.delete(d.dataset.k); }
    }, true);
    this.logViewer.addEventListener('click', ev => {
      const f = ev.target.closest('[data-filter]');
      if (f) { const t = f.dataset.filter; if (this.logFilter.has(t)) this.logFilter.delete(t); else this.logFilter.add(t); this.renderLogViewer(); return; }
      const b = ev.target.closest('[data-action]');
      if (b) this.onAction(b.dataset.action, b);
    });
    [this.$('settingsModalBody'), this.settingsViewer].forEach(c => {
      c.addEventListener('change', ev => { const el = ev.target.closest('[data-setting]'); if (el) this.onSettingChange(el); });
      c.addEventListener('click', ev => {
        const tab = ev.target.closest('[data-settings-tab]');
        if (tab) { this.settingsTab = tab.dataset.settingsTab; this.refreshSettingsUI(); return; }
        const b = ev.target.closest('[data-action]'); if (b) this.onAction(b.dataset.action, b);
      });
    });
    DebugLog.event('app-start', { userAgent: navigator.userAgent, viewport: `${innerWidth}x${innerHeight}`, puterLoaded: this.puterReady() });
  }

  scheduleLogRender() {
    this.netLogToggleBtn.classList.toggle('hidden', DebugLog.entries.length === 0);
    if (this._logTimer) return;
    this._logTimer = setTimeout(() => {
      this._logTimer = null;
      if (this.activeTab === 'log' && !this.sidePanel.classList.contains('hidden')) this.renderLogViewer();
    }, 250);
  }

  /* Wrap the Puter SDK so every call (args, result, errors, streamed chunks) lands in the log. */
  instrumentPuter() {
    if (!this.puterReady() || this._instrumented) return;
    this._instrumented = true;
    const targets = { ai: ['chat', 'listModels', 'txt2img', 'img2txt', 'txt2speech'], auth: ['isSignedIn', 'signIn', 'signOut', 'getUser', 'getMonthlyUsage'] };
    Object.keys(targets).forEach(ns => targets[ns].forEach(n => { try { DebugLog.wrapSdk(puter[ns], n, `puter.${ns}.${n}`); } catch (_) {} }));
    DebugLog.event('sdk-instrumented', { puterLoaded: true });
  }

  /* ---------- settings ---------- */
  saveSettings() { try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(this.settings)); } catch (_) {} }

  setTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('puter-theme', t); } catch (_) {}
  }

  applyUsageTimer() {
    clearInterval(this._usageTimer);
    const s = Number(this.settings.usageRefreshSec) || 0;
    if (s > 0) this._usageTimer = setInterval(() => { if (this.signedIn) this.loadUsage(); }, s * 1000);
  }

  onSettingChange(el) {
    const key = el.dataset.setting, def = SETTING_DEFS[key];
    if (!def) return;
    let val = def.type === 'bool' ? el.checked : el.value;
    if (def.numeric) val = Number(val);
    if (key === 'theme') this.setTheme(val);
    else { this.settings[key] = val; this.saveSettings(); }
    DebugLog.event('setting-changed', { key, value: val });
    if (key === 'usageRefreshSec') this.applyUsageTimer();
    if (key === 'maxEntries') DebugLog.trim();
    this.refreshSettingsUI(key);
    this.scheduleLogRender();
  }

  refreshSettingsUI(focusKey) {
    const targets = [];
    if (this.$('settingsModal').classList.contains('open')) targets.push(this.$('settingsModalBody'));
    if (this.activeTab === 'settings') targets.push(this.settingsViewer);
    if (!targets.length) return;
    const html = this.settingsHTML();
    targets.forEach(t => {
      const sc = t.scrollTop;
      t.innerHTML = html;
      t.scrollTop = sc;
      const f = focusKey && t.querySelector(`[data-setting="${focusKey}"]`);
      if (f) f.focus();
    });
  }

  async onAction(action, btn) {
    const flash = (txt) => { const o = btn.textContent; btn.textContent = txt; setTimeout(() => { btn.textContent = o; }, 1500); };
    if (action === 'copy-report') await this.copyReport(btn);
    else if (action === 'download-report') this.downloadReport();
    else if (action === 'refresh-models') { await this.loadModels(); this.refreshSettingsUI(); }
    else if (action === 'refresh-usage') { await this.loadUsage(); this.refreshSettingsUI(); }
    else if (action === 'copy-log') {
      try { await navigator.clipboard.writeText(this.formatLog()); flash('Copied!'); } catch (_) { flash('Failed'); }
    } else if (action === 'clear-log') { DebugLog.clear(); this.renderLogViewer(); this.refreshSettingsUI(); }
    else if (action === 'open-log') { this.$('settingsModal').classList.remove('open'); this.openTabs(['log'], 'log'); }
    else if (action === 'reset-settings') {
      Object.assign(this.settings, DEFAULT_SETTINGS);
      this.saveSettings(); this.applyUsageTimer(); DebugLog.trim();
      DebugLog.event('settings-reset');
      this.refreshSettingsUI(); this.scheduleLogRender();
    }
  }

  loadTheme() { const s = localStorage.getItem('puter-theme'); if (s) document.documentElement.setAttribute('data-theme', s); }
  setupTextarea() { this.chatInput.style.height = 'auto'; }

  async addFiles(fileList) {
    const MAX = 1024 * 1024; // 1 MB per file
    for (const f of Array.from(fileList || [])) {
      try {
        if (f.size > MAX) { this.showBanner(`${f.name}: too large (${(f.size/1048576).toFixed(1)} MB, max 1 MB).`); setTimeout(() => this.hideBanner(), 4000); continue; }
        const text = await f.text();
        if (text.slice(0, 4000).includes('\u0000')) { this.showBanner(`${f.name}: binary files aren't supported — attach text, code, CSV, JSON, Markdown etc.`); setTimeout(() => this.hideBanner(), 4500); continue; }
        this.addAttachment(text, f.name);
      } catch (e) { console.error(e); this.showBanner(`Could not read ${f.name}`); setTimeout(() => this.hideBanner(), 4000); }
    }
  }
  addAttachment(text, name) {
    const id = Date.now() + Math.random();
    const kb = (text.length / 1024).toFixed(2);
    this.attachments.push({ id, name: name || `pasted-${this.attachments.length + 1}.txt`, size: `${kb} KB`, text });
    this.renderAttachments();
    this.updateSendState();
  }
  removeAttachment(id) {
    this.attachments = this.attachments.filter(a => a.id !== id);
    this.renderAttachments();
    this.updateSendState();
  }
  clearAttachments() {
    this.attachments = [];
    this.renderAttachments();
    this.updateSendState();
  }
  renderAttachments() {
    this.attachmentsEl.innerHTML = '';
    if (!this.attachments.length) { this.attachmentsEl.classList.remove('active'); return; }
    this.attachmentsEl.classList.add('active');
    this.attachments.forEach(a => {
      const tile = document.createElement('div');
      tile.className = 'attachment-tile';
      const ext = (a.name.split('.').pop() || 'txt').slice(0, 4).toUpperCase();
      tile.innerHTML = `<div class="icon">${esc(ext)}</div><div class="info"><div class="name">${esc(a.name)}</div><div class="size">${esc(a.size)}</div></div><button class="remove" title="Remove">×</button>`;
      tile.querySelector('.remove').addEventListener('click', () => this.removeAttachment(a.id));
      this.attachmentsEl.appendChild(tile);
    });
  }

  showSignInPrompt() {
    const w = this.$('welcome');
    if (w) {
      w.innerHTML = `<h1>Sign in</h1><p style="color:var(--danger);font-weight:600">Not signed in — connect your Puter account to use AI models.</p>
        <button id="signInBtn" style="margin-top:16px;padding:10px 24px;border:none;border-radius:20px;background:var(--accent);color:#fff;font-size:.95rem;cursor:pointer;">Sign in with Puter</button>`;
      this.$('signInBtn').addEventListener('click', () => this.handleSignIn());
    }
    this.usageText.innerHTML = '<span class="err">Not signed in</span>';
    this.chatInput.disabled = true; this.sendBtn.disabled = true;
  }
  async handleSignIn() {
    if (!this.puterReady()) return;
    try { await puter.auth.signIn({ attempt_temp_user_creation: true }); await this.afterSignIn(); }
    catch (e) { console.error(e); this.usageText.innerHTML = '<span class="err">Sign in failed</span>'; }
  }
  async afterSignIn() {
    this.signedIn = true;
    this.$('welcome')?.remove();
    if (!this.chatMessages.children.length) {
      this.chatMessages.innerHTML = `<div class="welcome" id="welcome"><h1>AI Chat</h1><p>How can I help you today?</p></div>`;
    }
    this.chatInput.disabled = false; this.updateSendState();
    try {
      this.setLoading('Loading account…');
      try { this.accountInfo = await puter.auth.getUser(); this.recordAccount(null); } catch (_) {}
      this.setLoading('Listing models…');
      await this.loadModels();
      this.setLoading('Checking quota…');
      await this.loadUsage();
    } catch (e) { console.error(e); }
    finally { this.setLoading(null); }
  }

  async loadModels() {
    if (!this.puterReady()) return;
    this.modelsByProvider = {};
    this.allModels = [];
    try {
      const models = await puter.ai.listModels();
      this.allModels = Array.isArray(models) ? models : [];
      this.allModels.forEach(m => {
        const id = typeof m === 'string' ? m : (m.id || m.name);
        if (!id) return;
        const declared = m.provider && String(m.provider).toLowerCase();
        const key = declared || inferProvider(id);
        (this.modelsByProvider[key] ||= []).push({ id, name: m.name || id, raw: m });
      });
    } catch (e) {
      console.warn('listModels failed', e);
      this.usageText.innerHTML = '<span class="err">Model list failed — see Log</span>';
      this.modelRow.classList.add('hidden');
      this.openTabs(['log'], 'log');
      return;
    }
    const providers = Object.keys(this.modelsByProvider).sort();
    if (!providers.length) {
      this.usageText.innerHTML = '<span class="err">No models returned — see Log</span>';
      this.modelRow.classList.add('hidden');
      this.openTabs(['log'], 'log');
      return;
    }
    this.modelRow.classList.remove('hidden');
    this.hideBanner();
    this.providerSelect.innerHTML = '';
    providers.forEach(p => {
      const o = document.createElement('option');
      o.value = p; o.textContent = providerLabel(p);
      this.providerSelect.appendChild(o);
    });
    const saved = localStorage.getItem('puter-model');
    let restored = false;
    if (saved) {
      for (const p of providers) {
        if (this.modelsByProvider[p].some(m => m.id === saved)) {
          this.providerSelect.value = p;
          this.providerSelect.dispatchEvent(new Event('change'));
          this.modelSelect.value = saved; restored = true; break;
        }
      }
    }
    if (!restored) {
      this.providerSelect.value = providers[0];
      this.providerSelect.dispatchEvent(new Event('change'));
    }
  }


  /* ---------- ACCOUNTS (switcher + per-account monthly usage) ----------
   * Each account's auth token and last-known allowance are kept in this browser's localStorage so you can
   * switch with one click. Usage for non-active accounts is the last snapshot (or press "Refresh all"). */
  saveAccounts() { try { localStorage.setItem('puter-accounts', JSON.stringify(this.accounts)); } catch (_) {} }
  currentUsername() { return this.accountInfo?.username || null; }

  parseAllowance(usage) {
    const info = usage?.allowanceInfo; if (!info) return null;
    return { remaining: Number(info.remaining) || 0, allowance: Number(info.monthUsageAllowance) || 0, unit: info.unit || 'credits', resetAt: info.resetAt || usage.resetAt || usage.nextResetAt || null };
  }

  recordAccount(snap) {
    const u = this.currentUsername(); if (!u) return;
    let token = null; try { token = puter.authToken || null; } catch (_) {}
    const old = this.accounts[u] || {};
    this.accounts[u] = Object.assign({}, old, { username: u, token: token || old.token || null, stale: false },
      snap ? Object.assign({}, snap, { updatedAt: Date.now() }) : {});
    this.saveAccounts(); this.updateAcctButton();
    if (!this.$('acctMenu').hidden) this.renderAcctMenu();
  }

  updateAcctButton() { this.$('acctName').textContent = this.currentUsername() || 'Account'; }

  ago(ts) {
    if (!ts) return 'never';
    const m = Math.round((Date.now() - ts) / 60000);
    if (m < 1) return 'just now'; if (m < 60) return m + 'm ago';
    const h = Math.round(m / 60); return h < 24 ? h + 'h ago' : Math.round(h / 24) + 'd ago';
  }

  renderAcctMenu() {
    const menu = this.$('acctMenu'); const cur = this.currentUsername();
    const list = Object.values(this.accounts).sort((a, b) => (a.username === cur ? -1 : b.username === cur ? 1 : a.username.localeCompare(b.username)));
    let h = '';
    if (!list.length) h += '<div class="acct-note">No accounts saved yet — they are added automatically when you sign in.</div>';
    list.forEach(a => {
      const pct = a.allowance > 0 ? Math.max(0, Math.min(100, (a.allowance - a.remaining) / a.allowance * 100)) : 0;
      const left = a.allowance > 0 ? 100 - pct : 0;
      const rem = a.remaining != null ? `${Number(a.remaining).toFixed(2)} / ${Number(a.allowance).toFixed(2)} ${esc(a.unit || 'credits')}` : 'usage unknown';
      const reset = this.formatReset(a.resetAt);
      h += `<div class="acct-item ${a.username === cur ? 'current' : ''}" data-user="${esc(a.username)}">
        <div class="acct-row"><span>${a.username === cur ? '● ' : ''}<b>${esc(a.username)}</b>${a.stale ? ' <span style="color:var(--danger)">· re-login needed</span>' : ''}</span>
        ${a.username === cur ? '' : '<button class="acct-x" data-remove="' + esc(a.username) + '" title="Forget this account">×</button>'}</div>
        <div class="acct-bar"><i class="${left < 10 ? 'low' : ''}" style="width:${left.toFixed(1)}%"></i></div>
        <div class="acct-sub"><span>${rem}${a.allowance > 0 ? ' · ' + left.toFixed(1) + '% left' : ''}</span><span>${reset ? 'resets in ' + reset + ' · ' : ''}${this.ago(a.updatedAt)}</span></div></div>`;
    });
    h += `<div class="acct-foot"><button data-act="refreshAll">↻ Refresh all</button><button data-act="add">+ Add account</button></div>
      <div class="acct-note">Tokens are stored in this browser only. "Add account" signs out first; if Puter signs you straight back into the same user, log out at puter.com in another tab and try again.</div>`;
    menu.innerHTML = h;
  }

  bindAcctEvents() {
    const btn = this.$('acctBtn'), menu = this.$('acctMenu');
    btn.addEventListener('click', e => { e.stopPropagation(); menu.hidden = !menu.hidden; if (!menu.hidden) this.renderAcctMenu(); });
    document.addEventListener('click', e => { if (!menu.hidden && !this.$('acctWrap').contains(e.target)) menu.hidden = true; });
    menu.addEventListener('click', e => {
      const rm = e.target.closest('[data-remove]');
      if (rm) { e.stopPropagation(); delete this.accounts[rm.dataset.remove]; this.saveAccounts(); this.renderAcctMenu(); return; }
      const act = e.target.closest('[data-act]');
      if (act) { act.dataset.act === 'add' ? this.addAccount() : this.refreshAllAccounts(); return; }
      const item = e.target.closest('.acct-item');
      if (item && !item.classList.contains('current')) this.switchAccount(item.dataset.user);
    });
  }

  async switchAccount(username) {
    if (this.isProcessing) { this.showBanner('Wait for the current response to finish before switching.'); setTimeout(() => this.hideBanner(), 3000); return; }
    const acc = this.accounts[username];
    this.$('acctMenu').hidden = true;
    if (!acc?.token || typeof puter.setAuthToken !== 'function') return this.addAccount();
    try {
      this.setLoading(`Switching to ${username}…`);
      puter.setAuthToken(acc.token);
      const u = await puter.auth.getUser();
      if (!u || (u.username && u.username !== username)) throw new Error('token does not match account');
      await this.afterSignIn();
    } catch (e) {
      console.error(e);
      acc.stale = true; this.saveAccounts();
      this.setLoading(null);
      this.showBanner(`Saved session for ${username} no longer works — use "Add account" to sign in again.`);
      setTimeout(() => this.hideBanner(), 5000);
      try { if (this.currentUsername()) { const t = this.accounts[this.currentUsername()]?.token; if (t) puter.setAuthToken(t); } } catch (_) {}
    }
  }

  async addAccount() {
    if (this.isProcessing) return;
    this.$('acctMenu').hidden = true;
    try { await puter.auth.signOut(); } catch (_) {}
    try { await puter.auth.signIn({ attempt_temp_user_creation: true }); await this.afterSignIn(); }
    catch (e) { console.error(e); this.usageText.innerHTML = '<span class="err">Sign in failed</span>'; }
  }

  async refreshAllAccounts() {
    if (this.isProcessing || typeof puter.setAuthToken !== 'function') return;
    const cur = this.currentUsername();
    let keep = null; try { keep = puter.authToken; } catch (_) {}
    this.setLoading('Refreshing usage for all accounts…');
    try {
      for (const a of Object.values(this.accounts)) {
        if (a.username === cur || !a.token) continue;
        try {
          puter.setAuthToken(a.token);
          const snap = this.parseAllowance(await puter.auth.getMonthlyUsage());
          if (snap) Object.assign(a, snap, { updatedAt: Date.now(), stale: false });
        } catch (e) { a.stale = true; }
      }
    } finally {
      try { if (keep) puter.setAuthToken(keep); } catch (_) {}
      this.saveAccounts(); this.setLoading(null); this.renderAcctMenu();
      await this.loadUsage();
    }
  }

  async loadUsage() {
    if (!this.puterReady()) { this.usageText.innerHTML = '<span class="err">Puter unavailable</span>'; return null; }
    try {
      const usage = await puter.auth.getMonthlyUsage();
      this.lastQuota = usage;
      const info = usage?.allowanceInfo;
      if (!info) { this.usageText.innerHTML = '<span class="err">Usage unavailable</span>'; return null; }
      const remaining = Number(info.remaining) || 0;
      const allowance = Number(info.monthUsageAllowance) || 0;
      const pct = allowance > 0 ? ((allowance - remaining) / allowance * 100) : 0;
      const unit = esc(info.unit || 'credits');
      const reset = this.formatReset(info.resetAt || usage.resetAt || usage.nextResetAt);
      this.usageText.innerHTML =
        `${unit}: <b>${remaining.toFixed(2)}</b> / ${allowance.toFixed(2)} (${pct.toFixed(2)}% used)` +
        (reset ? ` · resets in ${reset}` : '');
      this.usageText.title = 'Monthly allowance is one pool shared by all models';
      this.updateModelUsage();
      this.recordAccount(this.parseAllowance(usage));
      return { remaining, allowance, pct };
    } catch (e) {
      this.usageText.innerHTML = '<span class="err">Usage error — see Log</span>';
      return null;
    }
  }

  normKey(s) { return String(s).toLowerCase().replace(/\./g, '_dot_'); }

  // usage keys look like "provider:model:metric"; dots in model ids are written "_dot_"
  usageByModel() {
    const u = this.lastQuota?.usage, map = {};
    if (!u) return [];
    for (const [k, v] of Object.entries(u)) {
      if (k === 'total' || !v || typeof v !== 'object') continue;
      const i = k.lastIndexOf(':'); if (i < 0) continue;
      const name = k.slice(0, i);
      const r = (map[name] ||= { name, cost: 0, count: 0 });
      r.cost += v.cost || 0; r.count = Math.max(r.count, v.count || 0);
    }
    return Object.values(map).sort((a, b) => b.cost - a.cost);
  }

  modelUsageFor(modelId) {
    const m = this.allModels.find(x => (x.id || x.name) === modelId) || {};
    const cands = new Set([this.normKey(modelId)]);
    if (m.provider) cands.add(this.normKey(m.provider + ':' + modelId));
    let cost = 0, count = 0;
    this.usageByModel().forEach(r => { if (cands.has(this.normKey(r.name))) { cost += r.cost; count = Math.max(count, r.count); } });
    return { cost, count };
  }

  updateModelUsage() {
    const el = this.modelUsageEl; if (!el) return;
    const id = this.modelSelect.value;
    if (!id || !this.lastQuota?.usage) { el.innerHTML = ''; return; }
    const r = this.modelUsageFor(id);
    el.innerHTML = `This model: <b>${r.cost.toFixed(2)}</b> cr · ${r.count} call${r.count === 1 ? '' : 's'}`;
  }

  formatReset(ts) {
    if (!ts) return '';
    const ms = typeof ts === 'number' ? ts : Date.parse(ts);
    if (!ms || isNaN(ms)) return '';
    const diff = ms - Date.now();
    if (diff <= 0) return 'now';
    const d = Math.floor(diff / 86400000);
    const h = Math.floor((diff % 86400000) / 3600000);
    const m = Math.floor((diff % 3600000) / 60000);
    if (d > 0) return `${d}d ${h}h`;
    if (h > 0) return `${h}h ${m}m`;
    return `${m}m`;
  }

  updateTotalUsage() {
    let tok = 0, cost = 0;
    for (const chat of Object.values(this.chats)) {
      tok += chat.totalTokens || 0;
      cost += chat.totalCost || 0;
    }
    this.totalUsage.innerHTML = `Σ <b>${tok.toLocaleString()}</b> tok · <b>$${cost.toFixed(6)}</b>`;
  }

  refreshCodeButton() {
    const chat = this.chats[this.currentChatId];
    const hasCode = !!(chat && chat.messages.some(m => m.role === 'ai' && this.extractCode(m.content)));
    this.codeToggleBtn.classList.toggle('hidden', !hasCode);
    this.netLogToggleBtn.classList.toggle('hidden', DebugLog.entries.length === 0);
  }

  isNearBottom() {
    const el = this.chatMessages;
    return el.scrollHeight - el.scrollTop - el.clientHeight < 120;
  }

  async handleSend() {
    if (this.isProcessing) return;
    if (!this.puterReady()) {
      this.addMessageToUI('Puter.js is not available. Check the CSP meta tag and the Network tab.', 'ai', 'error');
      this.openTabs(['log'], 'log');
      return;
    }
    if (!this.modelSelect.value) {
      this.addMessageToUI('No model selected — the model list failed to load. Open Log for details.', 'ai', 'error');
      this.openTabs(['log'], 'log');
      return;
    }
    const msg = this.chatInput.value.trim();
    let prefix = '';
    if (this.attachments.length) {
      prefix = this.attachments.map(a => `--- ${a.name} (${a.size}) ---\n${a.text}`).join('\n\n') + '\n\n';
    }
    const fullMsg = prefix + msg;
    if (!fullMsg.trim()) return;
    const displayMsg = (this.attachments.length ? this.attachments.map(a => `📎 ${a.name} (${a.size})`).join('\n') + (msg ? '\n\n' : '') : '') + msg;
    this.attachments = []; this.renderAttachments();

    this.chatInput.value = ''; this.chatInput.style.height = 'auto';
    this.isProcessing = true; this.updateSendState();
    this.streamingEl.classList.add('active');

    if (!this.currentChatId) {
      this.currentChatId = Date.now().toString();
      this.chats[this.currentChatId] = { title: (msg || prefix).substring(0, 30), messages: [], totalTokens: 0, totalCost: 0 };
    }
    const chatId = this.currentChatId;           // captured: user may switch chats mid-stream
    const chat = this.chats[chatId];
    const stillViewing = () => this.currentChatId === chatId;

    // Build the full conversation so the model has context (previously only the last message was sent)
    const history = chat.messages.map(m => ({ role: m.role === 'ai' ? 'assistant' : 'user', content: m.content }));
    history.push({ role: 'user', content: fullMsg });

    this.addMessageToUI(displayMsg, 'user', 'You');
    chat.messages.push({ role: 'user', content: fullMsg, display: displayMsg });
    this.saveChats();

    const model = this.modelSelect.value;
    DebugLog.event('send', { model, chatId, historyMessages: history.length, promptChars: fullMsg.length, hadAttachments: !!prefix });
    const raw = [];
    let usageInfo = null;
    let reasoningText = '';

    try {
      const response = await puter.ai.chat(history, { model, stream: true });
      const aiEl = this.addMessageToUI('', 'ai', model);
      const contentEl = aiEl.querySelector('.message-content');
      let full = '';
      let reasoningEl = null;
      for await (const part of response) {
        raw.push(part);
        if (part?.usage) usageInfo = part.usage;
        const think = part?.thinking || part?.reasoning;
        if (think) {
          reasoningText += think;
          if (!reasoningEl) reasoningEl = this.insertReasoningBlock(aiEl, reasoningText);
          else reasoningEl.querySelector('pre').textContent = reasoningText;
        }
        if (part?.text) {
          full += part.text;
          const follow = this.isNearBottom();
          contentEl.innerHTML = this.renderMarkdown(full);
          if (follow) this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
        }
      }
      chat.messages.push({ role: 'ai', content: full, usage: usageInfo, model, reasoning: reasoningText, chunks: raw.slice(0, 20000) });
      const norm = normaliseUsage(usageInfo);
      if (norm) {
        chat.totalTokens = (chat.totalTokens || 0) + norm.inTok + norm.outTok;
        chat.totalCost = (chat.totalCost || 0) + (norm.usd || 0);
      }
      this.saveChats();
      this.updateTotalUsage();
      this.updateMsgMeta(aiEl, usageInfo, raw, model, full);
      DebugLog.event('response-complete', { model, chars: full.length, chunks: raw.length, reasoningChars: reasoningText.length, usage: usageInfo });
      if (stillViewing()) { this.showCodeInPanel(full, { open: this.settings.autoOpenPanel }); this.refreshCodeButton(); }
      this.renderNetworkLog();
      await this.loadUsage();
    } catch (err) {
      console.error(err);
      DebugLog.event('send-error', { model, error: err });
      // Drop the failed user turn from history so the next request isn't two user messages in a row
      const last = chat.messages[chat.messages.length - 1];
      if (last && last.role === 'user') chat.messages.pop();
      this.saveChats();
      let text = err?.message || err?.error?.message || (typeof err === 'string' ? err : JSON.stringify(err));
      const e2 = (err && typeof err === 'object' && Array.isArray(err.attempts)) ? err : (err?.error && Array.isArray(err.error.attempts) ? err.error : null);
      if (e2) {
        const lines = e2.attempts.map(a => `• ${a.provider || '?'} / ${a.model || '?'} — ${a.status || ''} ${a.error || ''}`.trim());
        text = `${e2.message || e2.error || 'Request failed'}${e2.code ? ' (' + e2.code + ')' : ''}\n${lines.join('\n')}\n\nThis model can't be used right now on Puter's side — pick a different model.`;
        this.markBadModel(model);
      }
      if (stillViewing()) this.addMessageToUI(`Error: ${text}`, 'ai', 'error');
    } finally {
      this.streamingEl.classList.remove('active');
      this.isProcessing = false;
      this.updateSendState();
      this.chatInput.focus();
      this.renderNetworkLog();
    }
  }

  insertReasoningBlock(aiEl, text) {
    const wrap = document.createElement('details');
    wrap.className = 'reasoning';
    wrap.innerHTML = `<summary>Reasoning</summary><pre></pre>`;
    wrap.querySelector('pre').textContent = text;
    if (this.settings.reasoningOpen) wrap.open = true;
    aiEl.insertBefore(wrap, aiEl.querySelector('.message-content'));
    return wrap;
  }

  renderMarkdown(text) {
    const re = /```([\w+-]*)\n([\s\S]*?)(?:```|$)/g;   // also renders an unterminated block while streaming
    let out = '', last = 0, m;
    while ((m = re.exec(text)) !== null) {
      out += esc(text.slice(last, m.index));
      const lang = m[1] || 'text';
      out += `<div class="code-block"><div class="code-block-header"><span>${esc(lang)}</span><button type="button" onclick="window.__copyCode(this)">Copy</button></div><pre><code>${esc(m[2])}</code></pre></div>`;
      last = m.index + m[0].length;
      if (m[0].length === 0) re.lastIndex++;
    }
    out += esc(text.slice(last));
    return out;
  }

  updateMsgMeta(aiEl, usage, raw, model, content) {
    if (!aiEl) return;
    const n = normaliseUsage(usage);
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    let usageText = 'usage not reported';
    if (n) {
      const usd = n.usd != null ? `$${n.usd.toFixed(7)}` : '—';
      const cr = n.credits != null ? ` · ${n.credits.toFixed(4)} cr` : '';
      usageText = `${n.inTok}↑ / ${n.outTok}↓ · ${n.inTok + n.outTok} tok · ${usd}${cr}`;
      if (n.thinkingTok) usageText += ` · ${n.thinkingTok} think`;
      if (n.cachedTok) usageText += ` · ${n.cachedTok} cached`;
    }
    meta.innerHTML = `<span>${esc(usageText)}</span><button type="button" class="view-raw-btn">View response</button>`;
    meta.querySelector('.view-raw-btn').addEventListener('click', () => {
      this.currentRaw = { model, usage, chunks: raw, content };
      this.openTabs(['raw'], 'raw');
    });
    aiEl.appendChild(meta);
  }

  rawText() {
    const raw = this.currentRaw;
    if (!raw) return '';
    const chunks = raw.chunks || [];
    if (!chunks.length) return '';
    return chunks.map(c => { try { return JSON.stringify(c); } catch (_) { return String(c); } }).join('\n');
  }

  badModels() { return safeJSON('puter-bad-models', {}); }
  markBadModel(id) {
    if (!id) return;
    const b = this.badModels(); b[id] = Date.now();
    try { localStorage.setItem('puter-bad-models', JSON.stringify(b)); } catch (_) {}
    [...this.modelSelect.options].forEach(o => { if (o.value === id && !o.textContent.startsWith('⚠')) o.textContent = '⚠ ' + o.textContent; });
  }

  prettyText() {
    const raw = this.currentRaw;
    if (!raw) return '';
    const chunks = raw.chunks || [];
    if (!chunks.length) return '';
    let reasoning = '', text = '', usage = null, extra = [];
    chunks.forEach(c => {
      if (!c) return;
      if (c.type === 'usage' || c.usage) { usage = c; return; }
      if (typeof c.text === 'string') text += c.text;
      else if (typeof c.reasoning === 'string') reasoning += c.reasoning;
      else if (typeof c.thinking === 'string') reasoning += c.thinking;
      else extra.push(c);
    });
    const out = [];
    out.push('// model\n' + (raw.model || 'unknown'));
    if (usage) out.push('// usage\n' + JSON.stringify(usage, null, 2));
    if (reasoning) out.push('// reasoning\n' + reasoning);
    out.push('// text\n' + (text || raw.content || ''));
    if (extra.length) out.push('// other chunks\n' + JSON.stringify(extra, null, 2));
    return out.join('\n\n');
  }

  currentRawView() { return this.rawMode === 'pretty' ? this.prettyText() : this.rawText(); }

  renderResponseViewer() {
    if (!this.rawMode) this.rawMode = 'raw';
    this.rawViewer.innerHTML = '';
    const pre = document.createElement('pre');
    pre.className = 'raw-text';
    pre.textContent = this.currentRaw ? (this.currentRawView() || 'No raw chunks stored for this message (sent before chunks were saved).') : 'No response selected.';
    this.rawViewer.appendChild(pre);
  }

  renderNetworkLog() { this.renderLogViewer(); }   // kept for existing call sites

  entryClass(e) {
    const st = e.status;
    if (e.error || st === 'error' || (typeof st === 'number' && st >= 500)) return 'err';
    if (['error', 'uncaught', 'unhandledrejection', 'resource-error'].includes(e.level)) return 'err';
    if (e.type === 'event' && /error|fail/i.test(e.name || '')) return 'err';
    if ((typeof st === 'number' && st >= 400) || e.level === 'warn') return 'warn';
    if ((typeof st === 'number' && st >= 200 && st < 400) || st === 'ok') return 'ok';
    return '';
  }

  entryHTML(e) {
    const blk = (label, v) => {
      if (v === undefined || v === null || v === '') return '';
      if (typeof v === 'object' && !Array.isArray(v) && !Object.keys(v).length) return '';
      const text = typeof v === 'string' ? v : JSON.stringify(v, null, 2);
      const k = `${e.id}:${label}`;
      const shown = text.length > 8000 ? text.slice(0, 8000) + `\n…[${text.length - 8000} more chars — use Copy report for everything]` : text;
      return `<details data-k="${esc(k)}" ${this.openLog.has(k) ? 'open' : ''}><summary>${esc(label)} <span class="k">${text.length} chars</span></summary><pre>${esc(shown)}</pre></details>`;
    };
    let title = '', body = '';
    if (e.type === 'network') {
      title = `${e.kind || 'net'} ${e.method || ''} ${e.status ?? '…'} · ${e.ms ?? '…'}ms`;
      body = `<div>${esc(e.url)}</div>${e.error ? `<div class="errtxt">${esc(e.error)}</div>` : ''}` +
        blk('request headers', e.reqHeaders) + blk('request body', e.reqBody) +
        blk('response headers', e.resHeaders) + blk('response body', e.resBody) + blk('messages', e.messages);
    } else if (e.type === 'sdk') {
      title = `sdk ${e.name} · ${e.status}${e.ms != null ? ` · ${e.ms}ms` : ''}${e.chunkCount != null ? ` · ${e.chunkCount} chunks` : ''}`;
      body = blk('args', e.args) + blk('result', e.result) + blk('assembled reasoning', e.assembledReasoning) + blk('assembled text', e.assembledText) +
        blk('usage', e.usage) + blk('chunks', e.chunks) + blk('error', e.error);
    } else if (e.type === 'event') {
      title = `event · ${e.name}`;
      body = blk('data', e.data);
    } else {
      title = `${e.type}${e.level ? '.' + e.level : ''}`;
      body = `<div>${esc(e.text)}</div>` + blk('stack', e.stack);
    }
    return `<div class="entry ${this.entryClass(e)}"><div class="meta"><span>#${e.id} ${esc(title)}</span><span>${esc((e.ts || '').slice(11, 23))}</span></div>${body}</div>`;
  }

  renderLogViewer() {
    if (!this.logViewer) return;
    const all = DebugLog.entries;
    this.netLogToggleBtn.classList.toggle('hidden', all.length === 0);
    if (this.activeTab !== 'log') return;
    const v = this.logViewer;
    const atBottom = v.scrollHeight - v.scrollTop - v.clientHeight < 40;
    const prevTop = v.scrollTop;
    const types = ['network', 'sdk', 'event', 'console', 'preview'];
    const counts = {}; all.forEach(e => { counts[e.type] = (counts[e.type] || 0) + 1; });
    const shown = all.filter(e => this.logFilter.has(e.type));
    let html = '';
    if (!DebugLog.settings.debugEnabled) html += `<div class="log-off">Debug logging is off — enable it in Settings (⚙).</div>`;
    html += `<div class="log-toolbar"><button data-action="copy-report" title="Log + rendered HTML of the page and the preview">Copy report</button><button data-action="download-report">Download report</button><button data-action="copy-log">Copy log only</button><button data-action="clear-log">Clear</button></div>`;
    html += `<div class="log-filters">${types.map(t => `<button class="chip ${this.logFilter.has(t) ? 'on' : ''}" data-filter="${t}">${t} ${counts[t] || 0}</button>`).join('')}</div>`;
    html += `<h4>Debug log (${shown.length}${shown.length !== all.length ? ' of ' + all.length : ''})</h4>`;
    shown.forEach(e => { html += this.entryHTML(e); });
    v.innerHTML = html;
    v.scrollTop = atBottom ? v.scrollHeight : prevTop;
  }

  renderSettingsView() { if (this.settingsViewer) this.settingsViewer.innerHTML = this.settingsHTML(); }

  optionHTML(it) {
    const S = this.settings;
    const cur = it.key === 'theme' ? (document.documentElement.getAttribute('data-theme') || 'light') : S[it.key];
    const dis = it.needsLog && !S.debugEnabled ? ' disabled' : '';
    const text = `<span class="opt-text">${esc(it.label)}${it.help ? `<small>${esc(it.help)}</small>` : ''}</span>`;
    if (it.type === 'bool') return `<label class="opt${dis ? ' off' : ''}"><input type="checkbox" data-setting="${it.key}"${cur ? ' checked' : ''}${dis}>${text}</label>`;
    const opts = it.options.map(([val, lab]) => `<option value="${esc(val)}"${String(cur) === String(val) ? ' selected' : ''}>${esc(lab)}</option>`).join('');
    return `<label class="opt${dis ? ' off' : ''}">${text}<select data-setting="${it.key}"${dis}>${opts}</select></label>`;
  }

  modelPriceHTML(m) {
    if (!m || typeof m !== 'object') {
      return '<div class="model-price">Pricing information unavailable.</div>';
    }

    // Puter currently exposes per-token rates as `costs` + `costs_currency`.
    // The older `cost` shape is also accepted for compatibility with other SDK versions.
    const c = (m.costs && typeof m.costs === 'object') ? m.costs
      : ((m.cost && typeof m.cost === 'object') ? m.cost : null);
    const tokens = Number(c?.tokens);
    const currency = String(m.costs_currency || c?.currency || '').toLowerCase();
    const divisor = currency === 'usd-cents' ? 100 : (currency === 'usd' ? 1 : null);

    if (c && Number.isFinite(tokens) && tokens > 0 && divisor !== null) {
      const inputKey = m.input_cost_key || 'prompt_tokens';
      const outputKey = m.output_cost_key || 'completion_tokens';
      const inputRaw = c[inputKey];
      const outputRaw = c[outputKey];
      const hasInput = inputRaw !== undefined && inputRaw !== null && Number.isFinite(Number(inputRaw));
      const hasOutput = outputRaw !== undefined && outputRaw !== null && Number.isFinite(Number(outputRaw));
      const scale = 1000000 / tokens / divisor;
      const fmt = v => '$' + (Number(v) * scale).toFixed(4);
      const input = hasInput ? fmt(inputRaw) : 'Not listed';
      const output = hasOutput ? fmt(outputRaw) : 'Not listed';
      if (hasInput || hasOutput) {
        const example = hasInput && hasOutput
          ? '$' + ((2000 * Number(inputRaw) + 1000 * Number(outputRaw)) / tokens / divisor).toFixed(6)
          : 'Unavailable (one or more rates are not listed)';
        return `<div class="model-price">Input: <b>${input}</b> / 1M tokens · Output: <b>${output}</b> / 1M tokens<br>Example: 2,000 input + 1,000 output tokens ≈ <b>${example}</b><small>Source: Puter costs (${esc(currency)}). A zero rate is shown as $0.0000; a missing rate is not assumed to be free.</small></div>`;
      }
    }

    // Some models publish only catalogPricing, which can contain multiple tiers
    // and/or omit one side (input or output). Preserve the catalogue's stated unit.
    const tiers = Array.isArray(m.catalogPricing) ? m.catalogPricing : [];
    const entries = [];
    tiers.forEach(tier => {
      (Array.isArray(tier?.prices) ? tier.prices : []).forEach(price => {
        if (price && price.amount !== undefined && price.amount !== null && Number.isFinite(Number(price.amount))) {
          entries.push(`${esc(price.name || price.type || 'Price')}: <b>${esc(String(price.amount))}</b> ${esc(price.unit || '')}`);
        }
      });
    });
    if (entries.length) {
      return `<div class="model-price">${entries.join('<br>')}<small>Source: Puter catalogPricing${currency ? ` (${esc(currency)})` : ''}. Amounts are shown as supplied by the catalogue; tiers are not combined into a single estimate.</small></div>`;
    }

    return '<div class="model-price">Pricing not supplied for this model in the Puter catalogue.</div>';
  }

  settingsHTML() {
    const S = this.settings;
    const a = this.accountInfo;
    const q = this.lastQuota?.allowanceInfo;
    const tab = this.settingsTab || 'general';
    const tabs = [['general','General'],['models','AI models'],['usage','Usage & accounts'],['debug','Debugging'],['diagnostics','Diagnostics']];
    let html = `<div class="settings-tabs" role="tablist">${tabs.map(([id,label]) => `<button type="button" role="tab" aria-selected="${tab === id}" data-settings-tab="${id}" class="${tab === id ? 'active' : ''}">${label}</button>`).join('')}</div>`;

    const renderGroup = g => {
      html += `<h4>${esc(g.group)}</h4>`;
      if (g.note) html += `<div class="opt-note">${esc(g.note)}</div>`;
      g.items.forEach(it => { html += this.optionHTML(it); });
      if (g.actions) html += `<div class="opt-actions"><button data-action="copy-report">Copy debug report</button><button data-action="download-report">Download report</button><button data-action="open-log">Open log</button><button data-action="clear-log">Clear log (${DebugLog.entries.length})</button></div>`;
    };

    if (tab === 'general') {
      SETTINGS_SCHEMA.filter(g => g.group === 'Behaviour').forEach(renderGroup);
    } else if (tab === 'models') {
      html += `<h4>AI model pricing</h4><p class="settings-intro">Rates are read live from <code>puter.ai.listModels()</code>. Values are converted to USD per million tokens where the catalogue provides a recognised currency. The example assumes 2,000 input and 1,000 output tokens; your actual charge depends on real token usage, caching and the selected model variant.</p>`;
      html += `<div class="opt-actions"><button data-action="refresh-models">Refresh model list</button></div>`;
      if (!this.allModels.length) html += '<div class="row">No model catalogue loaded yet. Sign in / wait for Puter.js, then refresh.</div>';
      this.allModels.forEach(m => {
        const id = typeof m === 'string' ? m : (m.id || m.name);
        if (!id) return;
        const provider = m.provider || inferProvider(id);
        const ctx = m.context || m.maxInputTokens || '?';
        const maxTok = m.max_tokens || '?';
        html += `<details><summary>${esc(id)} · <span class="k">${esc(providerLabel(provider))}</span></summary>
          <div class="row"><span class="k">Provider</span> <span class="v">${esc(provider)}</span></div>
          <div class="row"><span class="k">Context</span> <span class="v">${esc(ctx)}</span></div>
          <div class="row"><span class="k">Max output</span> <span class="v">${esc(maxTok)}</span></div>
          ${this.modelPriceHTML(m)}
          <details><summary>Raw model JSON</summary><pre>${esc(JSON.stringify(m, null, 2))}</pre></details>
        </details>`;
      });
      html += '<p class="settings-intro">A missing input or output rate is shown separately and is not assumed to be free. Zero rates are displayed as $0.0000. Some models publish tiered catalogPricing rather than a single rate. Prices can change.</p>';
    } else if (tab === 'usage') {
      if (S.showAccount) {
        html += '<h4>Account</h4>';
        if (a) {
          html += `<div class="row"><span class="k">User</span> <span class="v">${esc(a.username || a.email || a.uuid || '(unknown)')}</span></div>`;
          html += `<div class="row"><span class="k">UUID</span> <span class="v">${esc(a.uuid || '')}</span></div>`;
        } else html += '<div class="row">Not available</div>';
      }
      if (S.showQuota) {
        html += '<h4>Quota</h4>';
        if (q) {
          html += `<div class="row">Remaining: <b>${num(q.remaining)}</b> ${esc(q.unit || '')}</div>`;
          html += `<div class="row">Allowance: <b>${num(q.monthUsageAllowance)}</b> ${esc(q.unit || '')}</div>`;
        } else html += '<div class="row">Not available</div>';
      }
      if (S.showUsage) {
        html += '<h4>Usage this month (allowance is shared by all models)</h4>';
        const rows = this.usageByModel();
        if (rows.length) rows.forEach(r => { html += `<div class="row"><span class="v">${esc(r.name)}</span> — <b>${r.cost.toFixed(3)}</b> cr · ${r.count} calls</div>`; });
        else html += '<div class="row">Not available</div>';
      }
      if (S.showRawUsage && this.lastQuota) html += `<details><summary>Raw usage JSON</summary><pre>${esc(JSON.stringify(this.lastQuota, null, 2))}</pre></details>`;
      html += '<div class="opt-actions"><button data-action="refresh-usage">Refresh usage / quota</button></div>';
      SETTINGS_SCHEMA.filter(g => g.group === 'Show on this page').forEach(renderGroup);
    } else if (tab === 'debug') {
      SETTINGS_SCHEMA.filter(g => g.group === 'Debug logging').forEach(renderGroup);
    } else if (tab === 'diagnostics') {
      SETTINGS_SCHEMA.filter(g => g.group === 'Debug report (Diag button / Copy report)').forEach(renderGroup);
      html += `<h4>Model catalogue diagnostics</h4><div class="row">Models loaded: <b>${this.allModels.length}</b></div><div class="row">Last quota snapshot: <b>${this.lastQuota ? 'available' : 'not available'}</b></div>`;
      html += `<div class="opt-actions"><button data-action="copy-report">Copy debug report</button><button data-action="download-report">Download report</button><button data-action="open-log">Open log</button></div>`;
    }
    if (tab === 'general') html += '<p class="settings-intro">Model selection is in the chat composer. Pricing and usage details are in the other settings tabs.</p>';
    html += `<div class="opt-actions"><button data-action="reset-settings">Reset settings to defaults</button></div>`;
    return html;
  }

  openSettings() {
    this.$('settingsModalBody').innerHTML = this.settingsHTML();
    this.$('settingsModal').classList.add('open');
  }

  /* ---------- code + website preview ---------- */
  showCodeInPanel(text, opts = {}) {
    const found = this.extractCode(text);
    if (!found) return;
    this.currentPanelState = found;
    this.codeFileIdx = 0;
    this.renderCodeTab();

    let srcdoc;
    if (found.bundle) srcdoc = found.bundle;           // the actual website: html + css + js combined
    else srcdoc = `<pre style="font-family:monospace;padding:16px;white-space:pre-wrap;">${esc(found.code)}</pre>`;
    this.previewSource = srcdoc;
    const hook = found.bundle && DebugLog.on('logPreview');
    this.previewFrame.srcdoc = hook ? this.injectPreviewHook(srcdoc) : srcdoc;
    DebugLog.event('preview-built', { website: !!found.bundle, files: found.files.map(f => ({ name: f.name, lang: f.lang, chars: f.code.length })), bundledChars: found.bundle ? found.bundle.length : 0, previewHook: !!hook });
    if (opts.open !== false) this.openTabs(['preview', 'code'], 'preview');
  }

  renderCodeTab() {
    const s = this.currentPanelState; if (!s) return;
    const items = s.files.slice();
    if (s.bundle) items.push({ name: s.fileName + ' (bundled)', code: s.bundle });
    const idx = Math.min(this.codeFileIdx || 0, items.length - 1);
    const bar = this.$('fileBar');
    bar.innerHTML = '';
    bar.hidden = items.length <= 1;
    items.forEach((f, i) => {
      const b = document.createElement('button');
      b.textContent = f.name;
      if (i === idx) b.classList.add('active');
      b.addEventListener('click', () => { this.codeFileIdx = i; this.renderCodeTab(); });
      bar.appendChild(b);
    });
    this.codeShown = items[idx];
    this.codeContent.textContent = this.codeShown.code;
    this.updateSideTitle();
  }

  injectPreviewHook(html) {
    const hook = '<scr' + 'ipt id="__dbg_capture">(function(){' +
      'function s(l,a){try{var t=[].map.call(a,function(x){if(typeof x==="string")return x;try{return JSON.stringify(x)}catch(e){return String(x)}}).join(" ");parent.postMessage({__previewLog:1,level:l,text:t},"*")}catch(e){}}' +
      '["log","info","warn","error","debug"].forEach(function(l){var o=console[l];console[l]=function(){s(l,arguments);return o.apply(console,arguments)}});' +
      'window.addEventListener("error",function(e){var r=e.target&&e.target!==window;s(r?"resource-error":"uncaught",[r?("failed to load <"+e.target.tagName.toLowerCase()+"> "+(e.target.src||e.target.href||"")):(e.message+" @ line "+e.lineno+":"+e.colno)])},true);' +
      'window.addEventListener("unhandledrejection",function(e){s("unhandledrejection",[(e.reason&&e.reason.stack)||String(e.reason)])});' +
      '})();<\/script>';
    const re = /<head(?:\s[^>]*)?>/i;
    return re.test(html) ? html.replace(re, m => m + hook) : html;
  }

  /* Every fenced block in a reply, with a file name taken from a first-line comment when present. */
  extractFiles(text) {
    const re = /```([\w+-]*)\n([\s\S]*?)```/g;
    const out = []; let m;
    while ((m = re.exec(text)) !== null) {
      const lang = (m[1] || 'text').toLowerCase();
      const kind = ({ html: 'html', htm: 'html', xhtml: 'html', css: 'css', js: 'js', javascript: 'js', mjs: 'js' })[lang] || null;
      const first = m[2].split('\n').find(l => l.trim()) || '';
      const nm = first.match(/^\s*(?:<!-{2}|\/\*|\/\/|#)\s*([\w.\-\/]+\.[A-Za-z0-9]+)\s*(?:-{2}>|\*\/)?\s*$/);
      out.push({ lang, kind, code: m[2], name: nm ? nm[1].split('/').pop() : null });
    }
    const seen = {};
    out.forEach((f, i) => {
      if (!f.name) {
        const ext = ({ html: 'html', css: 'css', js: 'js' })[f.kind] || ({ python: 'py', json: 'json' })[f.lang] || 'txt';
        f.name = f.kind === 'html' ? 'index.html' : f.kind === 'css' ? 'style.css' : f.kind === 'js' ? 'script.js' : `file${i + 1}.${ext}`;
      }
      const n = (seen[f.name] = (seen[f.name] || 0) + 1);
      if (n > 1) f.name = f.name.replace(/(\.[^.]+)?$/, `-${n}$1`);
    });
    return out;
  }

  /* Combine the html/css/js blocks of a reply into one self-contained page for the preview. */
  bundleWebPage(files) {
    const htmls = files.filter(f => f.kind === 'html');
    if (!htmls.length) return null;
    const page = [...htmls].reverse().find(f => /<!DOCTYPE html|<html[\s>]/i.test(f.code)) || htmls[htmls.length - 1];
    const css = files.filter(f => f.kind === 'css'), js = files.filter(f => f.kind === 'js');
    const used = new Set();
    const base = p => String(p).split(/[?#]/)[0].split('/').pop().toLowerCase();
    const external = u => /^(https?:)?\/\//i.test(u) || /^data:/i.test(u);
    const find = (list, ref) => {
      let f = list.find(x => x.name.toLowerCase() === base(ref) && !used.has(x));
      if (!f && !external(ref)) f = list.find(x => !used.has(x));   // differently-named local file: use the next unused block
      return f;
    };
    let html = page.code;
    if (!/<html[\s>]/i.test(html)) {
      html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"></head><body>${html}</body></html>`;
    }
    html = html.replace(/<link\b[^>]*\brel=["']?stylesheet["']?[^>]*>/gi, tag => {
      const h = /href=["']([^"']+)["']/i.exec(tag);
      if (!h) return tag;
      const f = find(css, h[1]);
      if (!f) return tag;
      used.add(f);
      return `<style>\n${f.code}\n</style>`;
    });
    html = html.replace(/<script\b([^>]*?)\bsrc=["']([^"']+)["']([^>]*)>\s*<\/script>/gi, (tag, a, src, b) => {
      const f = find(js, src);
      if (!f) return tag;
      used.add(f);
      const attrs = (a + b).replace(/\s+(defer|async)(=["'][^"']*["'])?/gi, '');
      return `<script${attrs}>\n${f.code.replace(/<\/script/gi, '<\\/script')}\n<\/script>`;
    });
    // blocks the page never referenced still belong to it: inject them
    const restCss = css.filter(f => !used.has(f)), restJs = js.filter(f => !used.has(f));
    if (restCss.length) {
      const s = restCss.map(f => `<style>\n${f.code}\n</style>`).join('\n');
      html = /<\/head>/i.test(html) ? html.replace(/<\/head>/i, m => s + '\n' + m) : s + html;
    }
    if (restJs.length) {
      const s = restJs.map(f => `<script>\n${f.code.replace(/<\/script/gi, '<\\/script')}\n<\/script>`).join('\n');
      html = /<\/body>/i.test(html) ? html.replace(/<\/body>/i, m => s + '\n' + m) : html + s;
    }
    return { html, name: page.name };
  }

  extractCode(text) {
    if (!text) return null;
    const files = this.extractFiles(text);
    if (!files.length) return null;
    const b = this.bundleWebPage(files);
    if (b) {
      const web = files.length > 1 ? `web page · ${files.length} files` : 'web page';
      return { code: b.html, lang: 'html', fileName: b.name, label: web, files, bundle: b.html };
    }
    const last = files[files.length - 1];
    return { code: last.code, lang: last.lang, fileName: last.name, label: last.lang, files, bundle: null };
  }

  addMessageToUI(text, sender, label) {
    this.$('welcome')?.remove();
    const div = document.createElement('div');
    div.className = `message ${sender}-message`;
    if (label === 'error') div.classList.add('error');
    const s = document.createElement('div'); s.className = 'message-sender';
    s.textContent = label === 'error' ? 'Error' : (label || (sender === 'user' ? 'You' : 'AI'));
    const c = document.createElement('div'); c.className = 'message-content';
    if (sender === 'ai' && label !== 'error') c.innerHTML = this.renderMarkdown(text);
    else c.textContent = text;
    div.appendChild(s); div.appendChild(c);
    this.chatMessages.appendChild(div);
    this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
    return div;
  }

  newChat() {
    this.currentChatId = null;
    this.chatMessages.innerHTML = `<div class="welcome" id="welcome"><h1>AI Chat</h1><p>How can I help you today?</p></div>`;
    this.clearAttachments();
    this.sidePanel.classList.add('hidden');
    this.currentPanelState = null; this.currentRaw = null;
    this.availableTabs = []; this.activeTab = null;
    this.codeToggleBtn.classList.add('hidden');
    this.loadHistory();
    this.chatInput.focus();
  }

  saveChats() {
    try { localStorage.setItem('puter-chats', JSON.stringify(this.chats)); }
    catch (e) { this.showBanner('Could not save chats (storage full?).'); }
    this.loadHistory();
  }

  loadHistory(filter = '') {
    this.historyList.innerHTML = '';
    Object.entries(this.chats).sort((a, b) => Number(b[0]) - Number(a[0])).forEach(([id, chat]) => {
      if (filter && !(chat.title || '').toLowerCase().includes(filter) &&
          !chat.messages.some(m => (m.content || '').toLowerCase().includes(filter))) return;
      const item = document.createElement('div');
      item.className = `history-item ${this.currentChatId === id ? 'active' : ''}`;
      const toks = (chat.totalTokens || 0).toLocaleString();
      const cost = (chat.totalCost || 0).toFixed(6);
      item.innerHTML = `${esc(chat.title || 'Untitled')}<div class="history-meta">${toks} tok · $${cost}</div>`;
      item.addEventListener('click', () => this.loadChat(id));
      const del = document.createElement('button');
      del.className = 'hist-del'; del.title = 'Delete chat'; del.textContent = '×';
      del.addEventListener('click', e => {
        e.stopPropagation();
        if (!del.classList.contains('armed')) {
          del.classList.add('armed'); del.textContent = 'Delete?';
          setTimeout(() => { if (del.isConnected) { del.classList.remove('armed'); del.textContent = '×'; } }, 3000);
          return;
        }
        this.deleteChat(id);
      });
      item.appendChild(del);
      this.historyList.appendChild(item);
    });
  }

  deleteChat(id) {
    delete this.chats[id];
    const wasCurrent = this.currentChatId === id;
    this.saveChats();
    this.updateTotalUsage();
    if (wasCurrent) this.newChat();
  }

  clearAllChats() {
    this.chats = {};
    this.saveChats();
    this.updateTotalUsage();
    this.newChat();
  }

  loadChat(id) {
    const chat = this.chats[id]; if (!chat) return;
    this.currentChatId = id;
    this.chatMessages.innerHTML = '';
    chat.messages.forEach(m => {
      const label = m.role === 'user' ? 'You' : (m.model || 'AI');
      const el = this.addMessageToUI(m.display || m.content, m.role === 'user' ? 'user' : 'ai', label);
      if (m.role === 'ai' && m.reasoning) this.insertReasoningBlock(el, m.reasoning);
      if (m.role === 'ai' && m.usage) this.updateMsgMeta(el, m.usage, m.chunks || [], m.model || 'AI', m.content);
    });
    const lastAI = [...chat.messages].reverse().find(m => m.role === 'ai');
    if (lastAI && this.extractCode(lastAI.content)) this.showCodeInPanel(lastAI.content);
    else { this.sidePanel.classList.add('hidden'); this.currentPanelState = null; this.availableTabs = []; this.activeTab = null; }
    this.refreshCodeButton();
    this.loadHistory();
  }

  /* Resizers only touch the CSS variable; setting inline width would override .hidden{width:0}
     and make the panels impossible to collapse after a resize. */
  setupResizers() {
    const makeResizer = (handle, target, side, varName) => {
      let startX, startW;
      const onMove = e => {
        const dx = e.clientX - startX;
        const w = Math.max(180, Math.min(700, side === 'left' ? startW + dx : startW - dx));
        document.documentElement.style.setProperty(varName, w + 'px');
      };
      const onUp = () => {
        handle.classList.remove('dragging');
        document.body.style.cursor = ''; document.body.style.userSelect = '';
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        try { localStorage.setItem('puter' + varName, document.documentElement.style.getPropertyValue(varName)); } catch (_) {}
      };
      handle.addEventListener('mousedown', e => {
        startX = e.clientX;
        startW = target.getBoundingClientRect().width || parseInt(getComputedStyle(document.documentElement).getPropertyValue(varName)) || 300;
        handle.classList.add('dragging');
        document.body.style.cursor = 'col-resize'; document.body.style.userSelect = 'none';
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
        e.preventDefault();
      });
    };
    makeResizer(this.$('leftResizer'), this.sidebar, 'left', '--sidebar-w');
    makeResizer(this.$('rightResizer'), this.sidePanel, 'right', '--sidepanel-w');
    ['--sidebar-w', '--sidepanel-w'].forEach(v => {
      const saved = localStorage.getItem('puter' + v);
      if (saved && /^\d+px$/.test(saved)) document.documentElement.style.setProperty(v, saved);
    });
  }

  setupScrollHelper() {
    const check = () => {
      const el = this.chatMessages;
      this.scrollHelper.classList.toggle('visible', !this.isNearBottom() && el.scrollHeight > el.clientHeight + 50);
    };
    this.chatMessages.addEventListener('scroll', check);
    this.scrollHelper.addEventListener('click', () => {
      this.chatMessages.scrollTo({ top: this.chatMessages.scrollHeight, behavior: 'smooth' });
    });
  }
}

window.__copyCode = async (btn) => {
  const pre = btn.closest('.code-block').querySelector('pre code');
  try { await navigator.clipboard.writeText(pre.textContent); btn.textContent = 'Copied!'; }
  catch (_) { btn.textContent = 'Failed'; }
  setTimeout(() => btn.textContent = 'Copy', 1200);
};

/* The app is always constructed; init() itself shows the "Puter unavailable" state.
   (Previously the app never started at all if puter.js failed to load.) */
window.addEventListener('load', () => { window.app = new AIChatApp(); });
</script>
