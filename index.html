<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://js.puter.com; connect-src 'self' https://api.puter.com https://js.puter.com https://*.puter.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self' data: blob:; child-src 'self' data: blob:;">
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Chat · Puter</title>
<style>
:root{
  --bg:#faf9f5;--surface-0:#ffffff;--surface-1:#f5f4ee;--surface-2:#ecebe3;--surface-3:#e4e2d7;
  --text-primary:#1a1a1a;--text-secondary:#5c5a54;--text-muted:#9a978e;
  --border:#e5e3d9;--border-strong:#d6d3c6;--accent:#d97757;--accent-hover:#c96647;
  --user-bubble:#f0eee6;--code-bg:#f7f6f0;--code-border:#e0ddd2;
  --font-ui:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-serif:Georgia,'Times New Roman',serif;
  --font-mono:'SF Mono','Consolas','Courier New',monospace;
  --radius:12px;--radius-sm:8px;--radius-lg:20px;
  --sidebar-w:270px;--sidepanel-w:460px;
}
[data-theme="dark"]{
  --bg:#1a1915;--surface-0:#22211d;--surface-1:#2a2924;--surface-2:#35332c;--surface-3:#3f3d35;
  --text-primary:#f0eee6;--text-secondary:#b8b5a8;--text-muted:#7d7a6e;
  --border:#3a3830;--border-strong:#4a4840;--accent:#d97757;--accent-hover:#e88a6c;
  --user-bubble:#35332c;--code-bg:#1e1d19;--code-border:#3a3830;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text-primary);min-height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:center;padding:16px;transition:background .2s,color .2s}
.app-layout{display:flex;width:100%;max-width:1500px;height:92vh;background:var(--surface-0);border-radius:var(--radius-lg);box-shadow:0 4px 24px rgba(0,0,0,.06);overflow:hidden;border:1px solid var(--border);position:relative}
/* Sidebar */
.sidebar{width:var(--sidebar-w);background:var(--surface-1);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;position:relative;transition:width .15s ease}
.sidebar.hidden{width:0;border-right:none}
.sidebar-header{padding:20px 16px 12px;display:flex;justify-content:space-between;align-items:center}
.brand{font-family:var(--font-serif);font-size:1.3rem;font-weight:500;letter-spacing:-.02em}
.sidebar-header button{background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--text-muted);padding:4px;border-radius:6px}
.sidebar-header button:hover{background:var(--surface-2)}
.new-chat-btn{margin:0 12px 12px;padding:10px 14px;background:var(--surface-0);border:1px solid var(--border-strong);border-radius:var(--radius-sm);font-size:.9rem;color:var(--text-primary);cursor:pointer;display:flex;align-items:center;gap:8px;transition:background .15s}
.new-chat-btn:hover{background:var(--surface-2)}
.plus-icon{font-size:1.1rem;color:var(--accent)}
.history-list{flex:1;overflow-y:auto;padding:4px 8px}
.history-item{padding:8px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:.85rem;color:var(--text-secondary);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s}
.history-item:hover{background:var(--surface-2)}
.history-item.active{background:var(--surface-3);color:var(--text-primary);font-weight:500}
.history-meta{font-size:.68rem;color:var(--text-muted);margin-top:2px;font-variant-numeric:tabular-nums}
/* Resize handles */
.resizer{width:5px;background:transparent;cursor:col-resize;flex-shrink:0;position:relative;z-index:5;transition:background .15s}
.resizer:hover,.resizer.dragging{background:var(--accent);opacity:.5}
/* Chat container */
.chat-container{flex:1;display:flex;flex-direction:column;min-width:0}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--surface-1);border-bottom:1px solid var(--border);gap:12px}
.top-bar button{background:none;border:none;font-size:.85rem;color:var(--text-secondary);cursor:pointer;padding:4px 10px;border-radius:6px;transition:background .15s}
.top-bar button:hover{background:var(--surface-2)}
.top-bar button.hidden{display:none}
.usage-bar{display:flex;gap:14px;align-items:center;font-size:.78rem;color:var(--text-muted);flex-wrap:wrap}
.usage-bar b{color:var(--text-secondary);font-weight:600}
.chat-messages{flex:1;padding:28px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;background:var(--bg)}
.welcome{text-align:center;color:var(--text-muted);margin:auto;padding:40px}
.welcome h1{font-family:var(--font-serif);font-weight:400;font-size:2.2rem;margin-bottom:8px;color:var(--text-primary)}
.welcome p{font-size:1rem;color:var(--text-secondary)}
.message{max-width:82%;padding:14px 18px;border-radius:var(--radius);line-height:1.6;font-size:.95rem}
.user-message{background:var(--user-bubble);align-self:flex-end;border-bottom-right-radius:4px}
.ai-message{background:var(--surface-0);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px;width:82%}
.message-sender{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);margin-bottom:6px;font-family:var(--font-mono)}
.message-content{white-space:pre-wrap;word-break:break-word}
.code-block{margin:10px 0;border:1px solid var(--code-border);border-radius:8px;overflow:hidden;background:var(--code-bg)}
.code-block-header{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--surface-2);font-size:.72rem;color:var(--text-secondary);border-bottom:1px solid var(--code-border)}
.code-block-header button{background:none;border:none;font-size:.72rem;color:var(--accent);cursor:pointer;text-decoration:underline}
.code-block pre{margin:0;padding:12px;overflow-x:auto;font-family:var(--font-mono);font-size:.8rem;line-height:1.5;color:var(--text-primary)}
.msg-meta{margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.7rem;color:var(--text-muted);font-variant-numeric:tabular-nums;border-top:1px solid var(--border);padding-top:8px;flex-wrap:wrap}
.msg-meta button{background:none;border:none;font-size:.7rem;color:var(--accent);cursor:pointer;text-decoration:underline;padding:0}
/* Composer */
.composer{padding:12px 24px 16px;background:var(--surface-0);border-top:1px solid var(--border)}
.composer-box{background:var(--surface-1);border:1px solid var(--border-strong);border-radius:var(--radius-lg);padding:10px 12px 6px;transition:border-color .2s,box-shadow .2s}
.composer-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,119,87,.12)}
#chatInput{width:100%;background:transparent;border:none;outline:none;font-family:var(--font-ui);font-size:.95rem;line-height:1.5;color:var(--text-primary);resize:none;min-height:24px;max-height:200px;padding:4px 6px}
#chatInput::placeholder{color:var(--text-muted)}
.composer-chin{display:flex;justify-content:space-between;align-items:center;padding-top:6px;margin-top:4px;border-top:1px solid var(--border)}
.chin-left{display:flex;align-items:center;gap:8px;min-width:0}
.chin-left.hidden{display:none}
.chin-right{display:flex;align-items:center;gap:8px}
.model-select{background:transparent;border:none;font-size:.8rem;color:var(--text-secondary);cursor:pointer;padding:4px 6px;border-radius:6px;outline:none;max-width:170px}
.model-select:hover{background:var(--surface-2)}
.send-btn{background:var(--accent);color:#fff;border:none;padding:7px 18px;border-radius:20px;font-size:.85rem;font-weight:500;cursor:pointer;transition:background .15s,opacity .15s}
.send-btn:hover:not(:disabled){background:var(--accent-hover)}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.attachment-chip{display:none;align-items:center;gap:10px;padding:8px 12px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:var(--radius-sm);margin-bottom:8px}
.attachment-chip.active{display:flex}
.attachment-icon{width:28px;height:28px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#418CFF;border-radius:6px;color:#fff;font-size:.7rem;font-weight:700}
.attachment-info{flex:1;min-width:0}
.attachment-name{font-size:.82rem;color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attachment-meta{font-size:.7rem;color:var(--text-muted)}
.attachment-remove{background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--text-muted);padding:0 4px}
.attachment-remove:hover{color:var(--accent)}
.streaming{display:none;text-align:center;color:var(--text-muted);font-size:.8rem;margin-top:8px}
.streaming.active{display:block}
.build-status{text-align:center;padding-top:8px;font-size:.7rem;color:var(--text-muted);font-variant-numeric:tabular-nums}
/* Side panel */
.side-panel{width:var(--sidepanel-w);background:var(--surface-1);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:width .15s ease}
.side-panel.hidden{width:0;border-left:none}
.side-panel-header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface-1)}
.segmented{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:2px;flex-shrink:0}
.segmented button{background:none;border:none;padding:5px 10px;border-radius:6px;font-size:.78rem;color:var(--text-secondary);cursor:pointer}
.segmented button.active{background:var(--surface-0);color:var(--text-primary);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.side-title{flex:1;min-width:0;font-size:.82rem;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.side-title b{color:var(--text-primary);font-weight:500}
.side-title .sep{opacity:.5;margin:0 4px}
.side-actions{display:flex;gap:4px;flex-shrink:0}
.side-actions button{background:none;border:none;font-size:.8rem;color:var(--text-secondary);cursor:pointer;padding:4px 8px;border-radius:6px}
.side-actions button:hover{background:var(--surface-2);color:var(--text-primary)}
.side-actions .primary{color:var(--accent);text-decoration:underline}
.side-body{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--surface-0)}
.side-tab{flex:1;display:flex;flex-direction:column;overflow:hidden}
.side-tab[hidden]{display:none}
.preview-frame{flex:1;border:none;background:#fff;width:100%;height:100%}
.code-preview{flex:1;padding:16px;overflow:auto;font-family:var(--font-mono);font-size:.78rem;line-height:1.5;background:var(--code-bg);white-space:pre-wrap;word-break:break-all}
.raw-viewer{flex:1;padding:16px;overflow:auto;font-family:var(--font-mono);font-size:.72rem;line-height:1.6;color:var(--text-primary);white-space:pre-wrap;word-break:break-word;background:var(--code-bg)}
.raw-viewer h4{font-family:var(--font-ui);font-size:.8rem;margin:14px 0 6px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px}
.raw-viewer .chunk{background:var(--surface-2);border-radius:4px;padding:6px 8px;margin:4px 0;border-left:2px solid var(--accent)}
@media(max-width:900px){.sidebar{display:none}.side-panel{width:340px}.resizer{display:none}}
@media(max-width:600px){body{padding:0}.app-layout{height:100vh;border-radius:0;border:none}.side-panel{display:none}.message{max-width:92%}.ai-message{width:92%}}
</style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="brand">Claude</div><button id="toggleThemeBtn" title="Toggle theme">🌓</button></div>
    <button id="newChatBtn" class="new-chat-btn"><span class="plus-icon">+</span> New chat</button>
    <div class="history-list" id="historyList"></div>
  </aside>
  <div class="resizer" id="leftResizer" title="Drag to resize sidebar"></div>

  <div class="chat-container">
    <div class="top-bar">
      <button id="toggleSidebarBtn" title="Toggle History">☰</button>
      <div class="usage-bar" id="usageBar">
        <span id="usageText">Usage loading…</span>
        <span id="totalUsage" title="Total tokens used across all chats">Σ <b>0</b> tok · <b>$0.0000</b></span>
        <button id="refreshUsageBtn" title="Refresh Puter quota">↻</button>
      </div>
      <button id="toggleLogBtn" class="hidden" title="Toggle Code View">Code</button>
    </div>

    <main class="chat-messages" id="chatMessages">
      <div class="welcome" id="welcome"><h1>Claude</h1><p>How can I help you today?</p></div>
    </main>

    <footer class="composer">
      <div class="attachment-chip" id="attachmentChip">
        <div class="attachment-icon">TXT</div>
        <div class="attachment-info">
          <div class="attachment-name" id="attachmentName">pasted.txt</div>
          <div class="attachment-meta" id="attachmentMeta">0 KB</div>
        </div>
        <button class="attachment-remove" id="removeAttachment" title="Remove">×</button>
      </div>
      <div class="composer-box">
        <textarea id="chatInput" placeholder="How can I help you today?" rows="1"></textarea>
        <div class="composer-chin">
          <div class="chin-left hidden" id="modelRow">
            <select id="providerSelect" class="model-select"><option value="">Provider…</option></select>
            <select id="modelSelect" class="model-select"><option value="">Model…</option></select>
          </div>
          <div class="chin-right"><button id="sendBtn" class="send-btn" disabled>Send</button></div>
        </div>
      </div>
      <div id="streamingIndicator" class="streaming">Claude is thinking…</div>
      <div class="build-status"><span id="build" class="status-build"></span></div>
    </footer>
  </div>

  <div class="resizer" id="rightResizer" title="Drag to resize panel"></div>
  <aside class="side-panel hidden" id="sidePanel">
    <div class="side-panel-header">
      <div class="segmented" role="tablist">
        <button class="active" data-tab="preview" role="tab">Preview</button>
        <button data-tab="code" role="tab">Code</button>
        <button data-tab="raw" role="tab">Raw</button>
      </div>
      <div class="side-title" id="sideTitle"><b id="codeFileName">code</b><span class="sep">·</span><span id="codeLanguage">html</span></div>
      <div class="side-actions">
        <button class="primary" id="copyCodeBtn" title="Copy code">Copy</button>
        <button id="downloadCodeBtn" title="Download file">⤓</button>
        <button id="closeSidePanelBtn" title="Close">×</button>
      </div>
    </div>
    <div class="side-body">
      <div class="side-tab" id="tab-preview"><iframe class="preview-frame" id="previewFrame" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" referrerpolicy="no-referrer"></iframe></div>
      <div class="side-tab" id="tab-code" hidden><pre class="code-preview"><code id="codeContent"></code></pre></div>
      <div class="side-tab" id="tab-raw" hidden><div class="raw-viewer" id="rawViewer"></div></div>
    </div>
  </aside>
</div>

<script>
/* ---------- BUILD STAMP ---------- */
(function () {
  const KEY = 'puter-build-meta';
  let prev = null;
  try { prev = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (_) {}
  let stamp, version = null, note = null, clockWorks = false;
  try {
    const now = new Date();
    if (now.getFullYear() < 2020) throw new Error('clock suspicious');
    const pad = n => String(n).padStart(2, '0');
    stamp = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    clockWorks = true;
  } catch (e) {
    stamp = 'unknown';
    version = (prev && prev.version ? prev.version : 0) + 1;
    note = 'AI had no clock access — version bumped.';
  }
  try { localStorage.setItem(KEY, JSON.stringify({ stamp, version, note, clockWorks })); } catch (_) {}
  document.addEventListener('DOMContentLoaded', () => {
    const el = document.getElementById('build');
    if (el) el.textContent = clockWorks ? `Build ${stamp}` : `Build ${stamp} · v${version} (${note})`;
  });
})();

/* ---------- APP ---------- */
class AIChatApp {
  constructor() {
    this.$ = id => document.getElementById(id);
    this.chatMessages = this.$('chatMessages');
    this.chatInput = this.$('chatInput');
    this.sendBtn = this.$('sendBtn');
    this.providerSelect = this.$('providerSelect');
    this.modelSelect = this.$('modelSelect');
    this.modelRow = this.$('modelRow');
    this.streamingEl = this.$('streamingIndicator');
    this.usageText = this.$('usageText');
    this.totalUsage = this.$('totalUsage');
    this.historyList = this.$('historyList');
    this.sidebar = this.$('sidebar');
    this.sidePanel = this.$('sidePanel');
    this.codeContent = this.$('codeContent');
    this.codeLanguage = this.$('codeLanguage');
    this.codeFileName = this.$('codeFileName');
    this.previewFrame = this.$('previewFrame');
    this.rawViewer = this.$('rawViewer');
    this.codeToggleBtn = this.$('toggleLogBtn');
    this.attachmentChip = this.$('attachmentChip');
    this.attachmentName = this.$('attachmentName');
    this.attachmentMeta = this.$('attachmentMeta');

    this.isProcessing = false;
    this.currentChatId = null;
    this.chats = JSON.parse(localStorage.getItem('puter-chats') || '{}');
    this.pasteBuffer = '';
    this.modelsByProvider = {};
    this.currentPanelState = null;
    this.currentRaw = null;

    this.init();
  }
  puterReady() { return typeof window.puter !== 'undefined'; }

  async init() {
    this.bindEvents();
    this.loadHistory();
    this.loadTheme();
    this.setupTextarea();
    this.setupResizers();
    this.updateTotalUsage();

    if (!this.puterReady()) {
      this.usageText.textContent = 'Puter unavailable — check CSP / network';
      this.providerSelect.innerHTML = '<option value="">Puter unavailable</option>';
      this.sendBtn.disabled = true;
      console.error('Puter.js not loaded. Check CSP meta is first in <head>, and https://js.puter.com/v2/ returns 200.');
      return;
    }
    let signedIn = false;
    try { signedIn = await puter.auth.isSignedIn(); } catch (_) {}
    if (!signedIn) { this.showSignInPrompt(); return; }
    await this.afterSignIn();
  }

  bindEvents() {
    this.sendBtn.addEventListener('click', e => { e.preventDefault(); this.handleSend(); });
    this.$('refreshUsageBtn').addEventListener('click', () => this.loadUsage());
    this.$('toggleSidebarBtn').addEventListener('click', () => this.sidebar.classList.toggle('hidden'));
    this.codeToggleBtn.addEventListener('click', () => this.sidePanel.classList.toggle('hidden'));
    this.$('closeSidePanelBtn').addEventListener('click', () => this.sidePanel.classList.add('hidden'));

    document.querySelectorAll('.segmented button').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.segmented button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const t = btn.dataset.tab;
        this.$('tab-preview').hidden = t !== 'preview';
        this.$('tab-code').hidden = t !== 'code';
        this.$('tab-raw').hidden = t !== 'raw';
        if (t === 'raw' && this.currentRaw) this.renderRawViewer(this.currentRaw);
      });
    });

    this.$('copyCodeBtn').addEventListener('click', () => {
      const content = document.querySelector('.segmented button.active').dataset.tab === 'raw'
        ? JSON.stringify(this.currentRaw, null, 2)
        : this.codeContent.textContent;
      navigator.clipboard.writeText(content);
      this.$('copyCodeBtn').textContent = 'Copied!';
      setTimeout(() => this.$('copyCodeBtn').textContent = 'Copy', 1500);
    });
    this.$('downloadCodeBtn').addEventListener('click', () => {
      const s = this.currentPanelState; if (!s) return;
      const ext = ({ html:'html', css:'css', js:'js', javascript:'js', python:'py', json:'json' })[s.lang] || 'txt';
      const blob = new Blob([s.code], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `${s.fileName}.${ext}`;
      a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });

    this.$('newChatBtn').addEventListener('click', () => this.newChat());
    this.$('removeAttachment').addEventListener('click', () => this.clearAttachment());

    this.chatInput.addEventListener('input', () => {
      this.chatInput.style.height = 'auto';
      this.chatInput.style.height = Math.min(this.chatInput.scrollHeight, 200) + 'px';
      this.sendBtn.disabled = this.chatInput.value.trim() === '' && !this.pasteBuffer;
    });
    this.chatInput.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); this.handleSend(); }
    });
    this.chatInput.addEventListener('paste', e => {
      const text = e.clipboardData.getData('text');
      if (text.length > 500) { e.preventDefault(); this.setAttachment(text); }
    });

    this.$('toggleThemeBtn').addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'light' ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('puter-theme', next);
    });

    this.providerSelect.addEventListener('change', () => {
      const p = this.providerSelect.value;
      this.modelSelect.innerHTML = '';
      if (!p) { this.modelSelect.innerHTML = '<option value="">Model…</option>'; return; }
      const models = this.modelsByProvider[p] || [];
      models.forEach(m => {
        const o = document.createElement('option');
        o.value = m.id; o.textContent = m.name || m.id;
        this.modelSelect.appendChild(o);
      });
      if (models.length) this.modelSelect.value = models[0].id;
      const saved = localStorage.getItem('puter-model');
      if (saved && models.some(m => m.id === saved)) this.modelSelect.value = saved;
    });
    this.modelSelect.addEventListener('change', () => localStorage.setItem('puter-model', this.modelSelect.value));
  }

  setupResizers() {
    const makeResizer = (handle, target, side, varName) => {
      let startX, startW;
      const onDown = e => {
        startX = e.clientX;
        startW = target.getBoundingClientRect().width;
        handle.classList.add('dragging');
        document.body.style.cursor = 'col-resize';
        document.body.style.userSelect = 'none';
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
        e.preventDefault();
      };
      const onMove = e => {
        const dx = e.clientX - startX;
        let w = side === 'left' ? startW + dx : startW - dx;
        w = Math.max(180, Math.min(700, w));
        target.style.width = w + 'px';
        document.documentElement.style.setProperty(varName, w + 'px');
      };
      const onUp = () => {
        handle.classList.remove('dragging');
        document.body.style.cursor = '';
        document.body.style.userSelect = '';
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        localStorage.setItem('puter-' + varName, target.style.width);
      };
      handle.addEventListener('mousedown', onDown);
    };
    makeResizer(this.$('leftResizer'), this.sidebar, 'left', '--sidebar-w');
    makeResizer(this.$('rightResizer'), this.sidePanel, 'right', '--sidepanel-w');

    const lw = localStorage.getItem('puter---sidebar-w');
    const rw = localStorage.getItem('puter---sidepanel-w');
    if (lw) { this.sidebar.style.width = lw; document.documentElement.style.setProperty('--sidebar-w', lw); }
    if (rw) { this.sidePanel.style.width = rw; document.documentElement.style.setProperty('--sidepanel-w', rw); }
  }

  loadTheme() { const s = localStorage.getItem('puter-theme'); if (s) document.documentElement.setAttribute('data-theme', s); }
  setupTextarea() { this.chatInput.style.height = 'auto'; }

  setAttachment(text) {
    this.pasteBuffer = text;
    const kb = (text.length / 1024).toFixed(2);
    this.attachmentName.textContent = 'pasted-content.txt';
    this.attachmentMeta.textContent = `TXT ${kb} KB`;
    this.attachmentChip.classList.add('active');
    this.chatInput.value = ''; this.chatInput.focus();
    this.sendBtn.disabled = false;
  }
  clearAttachment() {
    this.pasteBuffer = '';
    this.attachmentChip.classList.remove('active');
    this.chatInput.value = ''; this.sendBtn.disabled = true; this.chatInput.focus();
  }

  showSignInPrompt() {
    const w = this.$('welcome');
    if (w) {
      w.innerHTML = `<h1>Sign in to chat</h1><p>Connect your Puter account to use AI models.</p>
        <button id="signInBtn" style="margin-top:16px;padding:10px 24px;border:none;border-radius:20px;background:var(--accent);color:#fff;font-size:.95rem;cursor:pointer;">Sign in with Puter</button>`;
      this.$('signInBtn').addEventListener('click', () => this.handleSignIn());
    }
    this.usageText.textContent = 'Not signed in';
    this.chatInput.disabled = true; this.sendBtn.disabled = true;
  }
  async handleSignIn() {
    if (!this.puterReady()) return;
    try { await puter.auth.signIn({ attempt_temp_user_creation: true }); await this.afterSignIn(); }
    catch (e) { console.error(e); this.usageText.textContent = 'Sign in failed'; }
  }
  async afterSignIn() {
    this.$('welcome')?.remove();
    this.chatInput.disabled = false; this.sendBtn.disabled = true;
    try { await this.loadModels(); } catch (e) { console.error(e); }
    try { await this.loadUsage(); } catch (e) { console.error(e); }
  }

  async loadModels() {
    if (!this.puterReady()) return;
    try {
      const models = await puter.ai.listModels();
      this.modelsByProvider = {};
      (Array.isArray(models) ? models : []).forEach(m => {
        const p = m.provider || 'other';
        (this.modelsByProvider[p] ||= []).push({ id: m.id || m.name, name: m.name || m.id });
      });
      const providers = Object.keys(this.modelsByProvider).sort();
      if (!providers.length) { this.modelRow.classList.add('hidden'); return; }
      this.modelRow.classList.remove('hidden');
      this.providerSelect.innerHTML = '';
      providers.forEach(p => {
        const o = document.createElement('option');
        o.value = p; o.textContent = p; this.providerSelect.appendChild(o);
      });
      const saved = localStorage.getItem('puter-model');
      let restored = false;
      if (saved) {
        for (const p of providers) {
          if (this.modelsByProvider[p].some(m => m.id === saved)) {
            this.providerSelect.value = p;
            this.providerSelect.dispatchEvent(new Event('change'));
            this.modelSelect.value = saved; restored = true; break;
          }
        }
      }
      if (!restored) {
        this.providerSelect.value = providers[0];
        this.providerSelect.dispatchEvent(new Event('change'));
      }
    } catch (e) {
      console.warn('listModels failed', e);
      this.modelRow.classList.add('hidden');
    }
  }

  async loadUsage() {
    if (!this.puterReady()) { this.usageText.textContent = 'Puter unavailable'; return; }
    try {
      const usage = await puter.auth.getMonthlyUsage();
      const info = usage?.allowanceInfo;
      if (!info) { this.usageText.textContent = 'Usage unavailable'; return; }
      const t = info.monthUsageAllowance, r = info.remaining;
      const p = t > 0 ? ((t - r) / t * 100).toFixed(1) : '?';
      this.usageText.textContent = `Quota: ${p}% used · $${(r / 1e8).toFixed(4)} left`;
    } catch (e) { this.usageText.textContent = 'Usage error'; }
  }

  updateTotalUsage() {
    let tok = 0, cost = 0;
    for (const chat of Object.values(this.chats)) {
      tok += chat.totalTokens || 0;
      cost += chat.totalCost || 0;
    }
    this.totalUsage.innerHTML = `Σ <b>${tok.toLocaleString()}</b> tok · <b>$${cost.toFixed(4)}</b>`;
  }

  /* Show/hide the Code button based on whether current chat has any code */
  refreshCodeButton() {
    const chat = this.chats[this.currentChatId];
    const hasCode = chat && chat.messages.some(m => m.role === 'ai' && this.extractCode(m.content));
    this.codeToggleBtn.classList.toggle('hidden', !hasCode);
  }

  async handleSend() {
    if (this.isProcessing) return;
    if (!this.puterReady()) {
      this.addMessageToUI('Puter.js is not available. Check the CSP meta tag and the Network tab.', 'ai', 'system');
      return;
    }
    let msg = this.chatInput.value.trim();
    if (this.pasteBuffer) { msg = this.pasteBuffer + (msg ? '\n\n' + msg : ''); this.clearAttachment(); }
    if (!msg) return;

    this.chatInput.value = ''; this.chatInput.style.height = 'auto';
    this.sendBtn.disabled = true; this.isProcessing = true;
    this.streamingEl.classList.add('active');

    if (!this.currentChatId) {
      this.currentChatId = Date.now().toString();
      this.chats[this.currentChatId] = { title: msg.substring(0, 30), messages: [], totalTokens: 0, totalCost: 0 };
    }
    this.addMessageToUI(msg, 'user', 'You');
    this.chats[this.currentChatId].messages.push({ role: 'user', content: msg });
    this.saveChats();

    const model = this.modelSelect.value || 'claude-sonnet-4-6';
    const raw = [];
    let usageInfo = null;

    try {
      const response = await puter.ai.chat(msg, { model, stream: true });
      const aiEl = this.addMessageToUI('', 'ai', model);
      const contentEl = aiEl.querySelector('.message-content');
      let full = '';
      for await (const part of response) {
        raw.push(part);
        if (part?.usage) usageInfo = part.usage;
        if (part?.text) {
          full += part.text;
          contentEl.innerHTML = this.renderMarkdown(full);
          this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
        }
      }
      this.chats[this.currentChatId].messages.push({ role: 'ai', content: full, usage: usageInfo, model });
      if (usageInfo) {
        const toks = (usageInfo.input_tokens || 0) + (usageInfo.output_tokens || 0);
        const usd = (usageInfo.usd_cents || 0) / 100;
        this.chats[this.currentChatId].totalTokens = (this.chats[this.currentChatId].totalTokens || 0) + toks;
        this.chats[this.currentChatId].totalCost = (this.chats[this.currentChatId].totalCost || 0) + usd;
      }
      this.updateMsgMeta(aiEl, usageInfo, raw, model);
      this.saveChats();
      this.updateTotalUsage();
      this.showCodeInPanel(full);
      this.refreshCodeButton();
      console.log('[Puter raw response]', raw);
    } catch (err) {
      console.error(err);
      this.addMessageToUI(`Error: ${err.message || err}`, 'ai', 'system');
    } finally {
      this.streamingEl.classList.remove('active');
      this.sendBtn.disabled = this.chatInput.value.trim() === '' && !this.pasteBuffer;
      this.isProcessing = false; this.chatInput.focus();
      this.loadUsage();
    }
  }

  renderMarkdown(text) {
    const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    const re = /```(\w*)\n([\s\S]*?)```/g;
    let out = '', last = 0, m;
    while ((m = re.exec(text)) !== null) {
      out += esc(text.slice(last, m.index));
      const lang = m[1] || 'text';
      const code = m[2];
      out += `<div class="code-block"><div class="code-block-header"><span>${lang}</span><button onclick="window.__copyCode(this)">Copy</button></div><pre><code>${esc(code)}</code></pre></div>`;
      last = m.index + m[0].length;
    }
    out += esc(text.slice(last));
    return out;
  }

  updateMsgMeta(aiEl, usage, raw, model) {
    if (!aiEl) return;
    const toks = usage ? (usage.input_tokens || 0) + (usage.output_tokens || 0) : null;
    const usd = usage ? (usage.usd_cents || 0) / 100 : null;
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.innerHTML = `
      <span>${toks != null ? `${usage.input_tokens||0}↑ / ${usage.output_tokens||0}↓ · ${toks} tok · $${usd.toFixed(4)}` : 'usage not reported'}</span>
      <button type="button" class="view-raw-btn">View raw response</button>
    `;
    meta.querySelector('.view-raw-btn').addEventListener('click', () => {
      this.currentRaw = { model, usage, chunks: raw };
      this.renderRawViewer(this.currentRaw);
      this.sidePanel.classList.remove('hidden');
      document.querySelectorAll('.segmented button').forEach(b => b.classList.remove('active'));
      document.querySelector('.segmented button[data-tab="raw"]').classList.add('active');
      this.$('tab-preview').hidden = true;
      this.$('tab-code').hidden = true;
      this.$('tab-raw').hidden = false;
      this.$('sideTitle').innerHTML = `<b>raw response</b><span class="sep">·</span>${model}`;
    });
    aiEl.appendChild(meta);
  }

  renderRawViewer(raw) {
    if (!raw) { this.rawViewer.textContent = 'No raw response available.'; return; }
    const esc = s => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    let html = '';
    html += `<h4>Model</h4><div class="chunk">${esc(raw.model || 'unknown')}</div>`;
    html += `<h4>Usage</h4><div class="chunk">${esc(JSON.stringify(raw.usage || {}, null, 2))}</div>`;
    html += `<h4>Streamed chunks (${raw.chunks?.length || 0})</h4>`;
    (raw.chunks || []).forEach((c, i) => {
      html += `<div class="chunk"><b>#${i + 1}</b> ${esc(JSON.stringify(c))}</div>`;
    });
    html += `<h4>Full JSON</h4><div class="chunk">${esc(JSON.stringify(raw, null, 2))}</div>`;
    this.rawViewer.innerHTML = html;
  }

  showCodeInPanel(text) {
    const found = this.extractCode(text);
    if (!found) return;
    this.currentPanelState = found;
    this.codeLanguage.textContent = found.lang;
    this.codeFileName.textContent = found.fileName;
    this.codeContent.textContent = found.code;
    this.$('sideTitle').innerHTML = `<b>${found.fileName}</b><span class="sep">·</span>${found.lang}`;
    if (found.lang === 'html' || /<!DOCTYPE html/i.test(found.code) || /<html[\s>]/i.test(found.code)) {
      const safe = found.code.replace(/<\/script>/gi, '<\\/script>');
      this.previewFrame.srcdoc = `<!DOCTYPE html><html><head><base target="_blank"></head><body>${safe}</body></html>`;
    } else {
      this.previewFrame.srcdoc = `<pre style="font-family:monospace;padding:16px;white-space:pre-wrap;">${found.code.replace(/</g,'&lt;')}</pre>`;
    }
    this.sidePanel.classList.remove('hidden');
    document.querySelectorAll('.segmented button').forEach(b => b.classList.remove('active'));
    document.querySelector('.segmented button[data-tab="preview"]').classList.add('active');
    this.$('tab-preview').hidden = false;
    this.$('tab-code').hidden = true;
    this.$('tab-raw').hidden = true;
  }

  extractCode(text) {
    if (!text) return null;
    const re = /```(\w*)\n([\s\S]*?)```/g;
    let m, last = '', lang = 'text';
    while ((m = re.exec(text)) !== null) { lang = m[1] || 'text'; last = m[2]; }
    if (!last) return null;
    const ext = ({ html:'html', css:'css', js:'js', javascript:'js', python:'py', json:'json' })[lang] || 'txt';
    return { code: last, lang, fileName: `code.${ext}` };
  }

  addMessageToUI(text, sender, label) {
    this.$('welcome')?.remove();
    const div = document.createElement('div');
    div.className = `message ${sender}-message`;
    const s = document.createElement('div'); s.className = 'message-sender';
    s.textContent = label || (sender === 'user' ? 'You' : 'Claude');
    const c = document.createElement('div'); c.className = 'message-content';
    if (sender === 'ai') c.innerHTML = this.renderMarkdown(text);
    else c.textContent = text;
    div.appendChild(s); div.appendChild(c);
    this.chatMessages.appendChild(div);
    this.chatMessages.scrollTop = this.chatMessages.scrollHeight;
    return div;
  }

  newChat() {
    this.currentChatId = null;
    this.chatMessages.innerHTML = `<div class="welcome" id="welcome"><h1>Claude</h1><p>How can I help you today?</p></div>`;
    this.clearAttachment(); this.sendBtn.disabled = true;
    this.sidePanel.classList.add('hidden');
    this.currentPanelState = null; this.currentRaw = null;
    this.codeToggleBtn.classList.add('hidden');
    this.loadHistory();
    this.chatInput.focus();
  }

  saveChats() { localStorage.setItem('puter-chats', JSON.stringify(this.chats)); this.loadHistory(); }

  loadHistory() {
    this.historyList.innerHTML = '';
    Object.entries(this.chats).sort((a,b)=>b[0]-a[0]).forEach(([id, chat]) => {
      const item = document.createElement('div');
      item.className = `history-item ${this.currentChatId===id?'active':''}`;
      const toks = (chat.totalTokens||0).toLocaleString();
      const cost = (chat.totalCost||0).toFixed(4);
      item.innerHTML = `${chat.title || 'Untitled'}<div class="history-meta">${toks} tok · $${cost}</div>`;
      item.addEventListener('click', () => this.loadChat(id));
      this.historyList.appendChild(item);
    });
  }

  loadChat(id) {
    const chat = this.chats[id]; if (!chat) return;
    this.currentChatId = id;
    this.chatMessages.innerHTML = '';
    chat.messages.forEach(m => {
      const label = m.role === 'user' ? 'You' : (m.model || 'Claude');
      const el = this.addMessageToUI(m.content, m.role === 'user' ? 'user' : 'ai', label);
      if (m.role === 'ai' && m.usage) this.updateMsgMeta(el, m.usage, [], m.model || 'Claude');
    });
    const lastAI = [...chat.messages].reverse().find(m => m.role === 'ai');
    if (lastAI && this.extractCode(lastAI.content)) {
      this.showCodeInPanel(lastAI.content);
    } else {
      this.sidePanel.classList.add('hidden');
      this.currentPanelState = null;
    }
    this.refreshCodeButton();
    this.loadHistory();
  }
}

window.__copyCode = (btn) => {
  const pre = btn.closest('.code-block').querySelector('pre code');
  navigator.clipboard.writeText(pre.textContent);
  btn.textContent = 'Copied!';
  setTimeout(() => btn.textContent = 'Copy', 1200);
};

window.addEventListener('load', () => {
  if (typeof window.puter === 'undefined') {
    console.error('Puter.js failed to load. Verify CSP meta is first in <head>, and js.puter.com/v2/ is 200.');
    document.getElementById('usageText').textContent = 'Puter unavailable — check console';
    return;
  }
  new AIChatApp();
});
</script>
<script src="https://js.puter.com/v2/"></script>
</body>
</html>
