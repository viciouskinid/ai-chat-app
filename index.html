<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://js.puter.com; connect-src 'self' https://api.puter.com https://js.puter.com https://*.puter.com wss://api.puter.com wss://*.puter.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://js.puter.com https://fonts.gstatic.com https://fonts.googleapis.com; img-src 'self' data: blob: https:; frame-src 'self' data: blob: https://puter.com https://*.puter.com; child-src 'self' data: blob: https://puter.com https://*.puter.com;">
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Chat · Puter</title>
<style>
:root{
  --bg:#faf9f5;--surface-0:#ffffff;--surface-1:#f5f4ee;--surface-2:#ecebe3;--surface-3:#e4e2d7;
  --text-primary:#1a1a1a;--text-secondary:#5c5a54;--text-muted:#9a978e;
  --border:#e5e3d9;--border-strong:#d6d3c6;--accent:#d97757;--accent-hover:#c96647;--danger:#c0392b;
  --user-bubble:#f0eee6;--code-bg:#f7f6f0;--code-border:#e0ddd2;
  --font-ui:'Segoe UI',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-serif:Georgia,'Times New Roman',serif;
  --font-mono:'SF Mono','Consolas','Courier New',monospace;
  --radius:12px;--radius-sm:8px;--radius-lg:20px;
  --sidebar-w:270px;--sidepanel-w:460px;
}
[data-theme="dark"]{
  --bg:#1a1915;--surface-0:#22211d;--surface-1:#2a2924;--surface-2:#35332c;--surface-3:#3f3d35;
  --text-primary:#f0eee6;--text-secondary:#b8b5a8;--text-muted:#7d7a6e;
  --border:#3a3830;--border-strong:#4a4840;--accent:#d97757;--accent-hover:#e88a6c;
  --user-bubble:#35332c;--code-bg:#1e1d19;--code-border:#3a3830;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font-ui);background:var(--bg);color:var(--text-primary);min-height:100vh;overflow:hidden;display:flex;justify-content:center;align-items:center;padding:16px;transition:background .2s,color .2s}
.app-layout{display:flex;width:100%;max-width:1500px;height:92vh;background:var(--surface-0);border-radius:var(--radius-lg);box-shadow:0 4px 24px rgba(0,0,0,.06);overflow:hidden;border:1px solid var(--border);position:relative;flex-direction:column}
.banner{display:none;padding:10px 16px;background:var(--danger);color:#fff;font-size:.82rem;text-align:center;font-weight:500}
.banner.visible{display:block}
.loading-banner{display:none;padding:8px 16px;background:var(--surface-2);color:var(--text-secondary);font-size:.8rem;text-align:center;border-bottom:1px solid var(--border)}
.loading-banner.visible{display:block}
.loading-banner .spinner{display:inline-block;width:12px;height:12px;border:2px solid var(--border-strong);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.main-row{display:flex;flex:1;min-height:0;position:relative}
.sidebar{width:var(--sidebar-w);background:var(--surface-1);border-right:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:width .15s ease}
.sidebar.hidden{width:0;border-right:none}
.sidebar-header{padding:16px 12px 8px;display:flex;justify-content:space-between;align-items:center}
.brand{font-family:var(--font-serif);font-size:1.3rem;font-weight:500;letter-spacing:-.02em}
.sidebar-header button{background:none;border:none;font-size:1.1rem;cursor:pointer;color:var(--text-muted);padding:4px;border-radius:6px}
.sidebar-header button:hover{background:var(--surface-2)}
.sidebar-rows{padding:0 8px 8px;display:flex;flex-direction:column;gap:2px}
.side-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:pointer;font-size:.88rem;color:var(--text-secondary);background:none;border:none;text-align:left;width:100%;transition:background .15s;white-space:nowrap}
.side-row:hover{background:var(--surface-2);color:var(--text-primary)}
.side-row svg{width:16px;height:16px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-row .shortcut{margin-left:auto;font-size:.68rem;color:var(--text-muted);opacity:0;transition:opacity .15s}
.side-row:hover .shortcut{opacity:1}
.history-list{flex:1;overflow-y:auto;padding:4px 8px 8px}
.history-section-label{font-size:.68rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);padding:12px 10px 4px}
.history-item{padding:8px 12px;border-radius:var(--radius-sm);cursor:pointer;font-size:.85rem;color:var(--text-secondary);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s}
.history-item:hover{background:var(--surface-2)}
.history-item.active{background:var(--surface-3);color:var(--text-primary);font-weight:500}
.history-meta{font-size:.66rem;color:var(--text-muted);margin-top:2px;font-variant-numeric:tabular-nums}
.resizer{width:5px;background:transparent;cursor:col-resize;flex-shrink:0;position:relative;z-index:5;transition:background .15s}
.resizer:hover,.resizer.dragging{background:var(--accent);opacity:.5}
.chat-container{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;background:var(--surface-1);border-bottom:1px solid var(--border);gap:12px}
.top-bar button{background:none;border:none;font-size:.85rem;color:var(--text-secondary);cursor:pointer;padding:4px 10px;border-radius:6px;transition:background .15s}
.top-bar button:hover{background:var(--surface-2)}
.top-bar button.hidden{display:none}
.usage-bar{display:flex;gap:14px;align-items:center;font-size:.78rem;color:var(--text-muted);flex-wrap:wrap}
.usage-bar b{color:var(--text-secondary);font-weight:600}
.usage-bar .err{color:var(--danger);font-weight:600}
.chat-messages{flex:1;padding:28px 24px;overflow-y:auto;display:flex;flex-direction:column;gap:18px;background:var(--bg);position:relative}
.welcome{text-align:center;color:var(--text-muted);margin:auto;padding:40px}
.welcome h1{font-family:var(--font-serif);font-weight:400;font-size:2.2rem;margin-bottom:8px;color:var(--text-primary)}
.welcome p{font-size:1rem;color:var(--text-secondary)}
.message{max-width:82%;padding:14px 18px;border-radius:var(--radius);line-height:1.6;font-size:.95rem}
.user-message{background:var(--user-bubble);align-self:flex-end;border-bottom-right-radius:4px}
.ai-message{background:var(--surface-0);border:1px solid var(--border);align-self:flex-start;border-bottom-left-radius:4px;width:82%}
.ai-message.error{border-color:var(--danger)}
.message-sender{font-size:.7rem;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--text-muted);margin-bottom:6px;font-family:var(--font-mono)}
.message-content{white-space:pre-wrap;word-break:break-word}
.reasoning{margin:8px 0;border:1px solid var(--border);border-radius:8px;background:var(--surface-1);overflow:hidden}
.reasoning summary{padding:6px 12px;font-size:.75rem;color:var(--text-secondary);cursor:pointer;user-select:none;background:var(--surface-2)}
.reasoning pre{padding:10px 12px;font-family:var(--font-mono);font-size:.78rem;line-height:1.5;color:var(--text-primary);white-space:pre-wrap;max-height:220px;overflow:auto}
.code-block{margin:10px 0;border:1px solid var(--code-border);border-radius:8px;overflow:hidden;background:var(--code-bg);white-space:normal}
.code-block-header{display:flex;justify-content:space-between;align-items:center;padding:6px 12px;background:var(--surface-2);font-size:.72rem;color:var(--text-secondary);border-bottom:1px solid var(--code-border)}
.code-block-header button{background:none;border:none;font-size:.72rem;color:var(--accent);cursor:pointer;text-decoration:underline}
.code-block pre{margin:0;padding:12px;overflow-x:auto;font-family:var(--font-mono);font-size:.8rem;line-height:1.5;color:var(--text-primary);white-space:pre}
.msg-meta{margin-top:10px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.7rem;color:var(--text-muted);font-variant-numeric:tabular-nums;border-top:1px solid var(--border);padding-top:8px;flex-wrap:wrap}
.msg-meta button{background:none;border:none;font-size:.7rem;color:var(--accent);cursor:pointer;text-decoration:underline;padding:0}
.scroll-helper{position:absolute;left:50%;transform:translateX(-50%);bottom:20px;width:36px;height:36px;border-radius:50%;background:var(--surface-0);border:1px solid var(--border-strong);box-shadow:0 2px 8px rgba(0,0,0,.1);display:none;align-items:center;justify-content:center;cursor:pointer;z-index:10;color:var(--text-secondary)}
.scroll-helper.visible{display:flex}
.scroll-helper:hover{background:var(--surface-2)}
.composer{padding:12px 24px 16px;background:var(--surface-0);border-top:1px solid var(--border)}
.attachments{display:none;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.attachments.active{display:flex}
.attachment-tile{display:flex;align-items:center;gap:8px;padding:6px 10px;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:8px;font-size:.78rem;max-width:220px}
.attachment-tile .icon{width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:#418CFF;border-radius:5px;color:#fff;font-size:.6rem;font-weight:700}
.attachment-tile .info{flex:1;min-width:0}
.attachment-tile .name{color:var(--text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.attachment-tile .size{font-size:.65rem;color:var(--text-muted)}
.attachment-tile .remove{background:none;border:none;font-size:1rem;cursor:pointer;color:var(--text-muted);padding:0 2px}
.attachment-tile .remove:hover{color:var(--accent)}
.composer-box{background:var(--surface-1);border:1px solid var(--border-strong);border-radius:var(--radius-lg);padding:10px 12px 6px;transition:border-color .2s,box-shadow .2s}
.composer-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,119,87,.12)}
#chatInput{width:100%;background:transparent;border:none;outline:none;font-family:var(--font-ui);font-size:.95rem;line-height:1.5;color:var(--text-primary);resize:none;min-height:24px;max-height:200px;padding:4px 6px}
#chatInput::placeholder{color:var(--text-muted)}
.composer-chin{display:flex;justify-content:space-between;align-items:center;padding-top:6px;margin-top:4px;border-top:1px solid var(--border)}
.chin-left{display:flex;align-items:center;gap:8px;min-width:0}
.chin-left.hidden{display:none}
.chin-right{display:flex;align-items:center;gap:8px;margin-left:auto}
.model-select{background:transparent;border:none;font-size:.8rem;color:var(--text-secondary);cursor:pointer;padding:4px 6px;border-radius:6px;outline:none;max-width:170px}
.model-select:hover{background:var(--surface-2)}
.model-select option{background:var(--surface-0);color:var(--text-primary)}
.send-btn{background:var(--accent);color:#fff;border:none;padding:7px 18px;border-radius:20px;font-size:.85rem;font-weight:500;cursor:pointer;transition:background .15s,opacity .15s}
.send-btn:hover:not(:disabled){background:var(--accent-hover)}
.send-btn:disabled{opacity:.4;cursor:not-allowed}
.streaming{display:none;text-align:center;color:var(--text-muted);font-size:.8rem;margin-top:8px}
.streaming.active{display:block}
.build-status{text-align:center;padding-top:8px;font-size:.7rem;color:var(--text-muted);font-variant-numeric:tabular-nums}
.side-panel{width:var(--sidepanel-w);background:var(--surface-1);border-left:1px solid var(--border);display:flex;flex-direction:column;flex-shrink:0;overflow:hidden;transition:width .15s ease}
.side-panel.hidden{width:0;border-left:none}
.side-panel-header{display:flex;align-items:center;gap:6px;padding:10px 12px;border-bottom:1px solid var(--border);background:var(--surface-1);flex-wrap:wrap}
.segmented{display:inline-flex;background:var(--surface-2);border-radius:8px;padding:2px;flex-shrink:0}
.segmented button{background:none;border:none;padding:5px 10px;border-radius:6px;font-size:.78rem;color:var(--text-secondary);cursor:pointer}
.segmented button.active{background:var(--surface-0);color:var(--text-primary);box-shadow:0 1px 2px rgba(0,0,0,.05)}
.side-title{flex:1;min-width:120px;font-size:.8rem;color:var(--text-secondary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:4px}
.side-title b{color:var(--text-primary);font-weight:500}
.side-title .sep{opacity:.5;margin:0 4px}
.side-actions{display:flex;gap:4px;flex-shrink:0;flex-wrap:wrap}
.side-actions button{background:none;border:none;font-size:.78rem;color:var(--text-secondary);cursor:pointer;padding:4px 8px;border-radius:6px}
.side-actions button:hover{background:var(--surface-2);color:var(--text-primary)}
.side-actions .primary{color:var(--accent);text-decoration:underline}
.side-close{font-size:1.1rem;padding:2px 8px;color:var(--text-muted);background:none;border:none;cursor:pointer;border-radius:6px;line-height:1}
.side-close:hover{background:var(--surface-2);color:var(--text-primary)}
.side-body{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--surface-0)}
.side-tab{flex:1;display:flex;flex-direction:column;overflow:hidden;min-height:0}
.side-tab[hidden]{display:none}
.preview-frame{flex:1;border:none;background:#fff;width:100%;height:100%}
.code-preview{flex:1;padding:16px;overflow:auto;font-family:var(--font-mono);font-size:.78rem;line-height:1.5;background:var(--code-bg);white-space:pre-wrap;word-break:break-all}
.raw-viewer,.log-viewer,.settings-viewer{flex:1;padding:16px;overflow:auto;font-family:var(--font-ui);font-size:.82rem;line-height:1.6;color:var(--text-primary);background:var(--surface-0)}
.raw-viewer h4,.log-viewer h4,.settings-viewer h4{font-family:var(--font-ui);font-size:.78rem;margin:14px 0 6px;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px}
.raw-viewer .chunk,.log-viewer .entry{background:var(--surface-2);border-radius:4px;padding:6px 8px;margin:4px 0;border-left:2px solid var(--accent);font-family:var(--font-mono);font-size:.72rem;white-space:pre-wrap;word-break:break-word}
.log-viewer .entry.ok{border-left-color:#2e7d32}
.log-viewer .entry.warn{border-left-color:#e67e22}
.log-viewer .entry.err{border-left-color:var(--danger)}
.log-viewer .entry .meta{display:flex;justify-content:space-between;font-size:.66rem;color:var(--text-muted);margin-bottom:4px}
.settings-viewer details,.modal-body details{border:1px solid var(--border);border-radius:6px;padding:6px 10px;margin:6px 0;background:var(--surface-1)}
.settings-viewer summary,.modal-body summary{cursor:pointer;font-size:.82rem;color:var(--text-primary)}
.k{color:var(--text-muted);font-size:.72rem;text-transform:uppercase;letter-spacing:.4px}
.v{font-family:var(--font-mono);font-size:.78rem;word-break:break-all}
.settings-viewer pre,.modal-body pre{font-family:var(--font-mono);font-size:.72rem;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto;margin-top:6px;background:var(--surface-2);padding:8px;border-radius:6px}
.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;align-items:center;justify-content:center}
.modal-backdrop.open{display:flex}
.modal{background:var(--surface-0);border:1px solid var(--border);border-radius:12px;max-width:720px;width:92%;max-height:80vh;display:flex;flex-direction:column;overflow:hidden}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-header h2{font-size:1rem;font-weight:600}
.modal-body{padding:18px;overflow:auto}
.modal-body h4{font-size:.78rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text-secondary);margin:14px 0 6px}
.modal-body .row{font-size:.82rem;margin:4px 0}
.modal-body .row b{color:var(--text-primary)}
@media(max-width:900px){.sidebar{display:none}.side-panel{width:340px}.resizer{display:none}}
@media(max-width:600px){body{padding:0}.app-layout{height:100vh;border-radius:0;border:none}.side-panel{display:none}.message{max-width:92%}.ai-message{width:92%}}

.file-bar{display:flex;gap:4px;flex-wrap:wrap;padding:6px 10px;border-bottom:1px solid var(--border);background:var(--surface-1)}
.file-bar[hidden]{display:none}
.file-bar button{background:none;border:1px solid var(--border);border-radius:6px;padding:3px 9px;font-size:.74rem;color:var(--text-secondary);cursor:pointer;font-family:var(--font-mono)}
.file-bar button.active{background:var(--surface-0);color:var(--text-primary);border-color:var(--border-strong)}
.log-toolbar,.opt-actions{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 10px}
.log-toolbar button,.opt-actions button{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:6px;padding:5px 10px;font-size:.76rem;color:var(--text-primary);cursor:pointer}
.log-toolbar button:hover,.opt-actions button:hover{background:var(--surface-3)}
.log-filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.chip{background:none;border:1px solid var(--border-strong);border-radius:20px;padding:2px 10px;font-size:.72rem;color:var(--text-muted);cursor:pointer}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.log-off{background:var(--surface-2);border-left:3px solid var(--danger);padding:6px 10px;border-radius:4px;font-size:.78rem;margin-bottom:8px}
.log-viewer .entry details{margin:4px 0 0;padding:3px 6px;border:1px solid var(--border);border-radius:5px;background:var(--surface-1)}
.log-viewer .entry summary{cursor:pointer;font-family:var(--font-ui);font-size:.7rem;color:var(--text-secondary)}
.log-viewer .entry pre{font-family:var(--font-mono);font-size:.68rem;white-space:pre-wrap;word-break:break-word;max-height:320px;overflow:auto;margin-top:4px;background:var(--surface-2);padding:6px;border-radius:5px}
.log-viewer .entry .errtxt{color:var(--danger);margin-top:4px}
.opt{display:flex;align-items:center;gap:10px;padding:6px 2px;font-size:.84rem;cursor:pointer;border-bottom:1px solid var(--border)}
.opt.off{opacity:.45;cursor:not-allowed}
.opt input[type=checkbox]{width:16px;height:16px;flex-shrink:0;accent-color:var(--accent)}
.opt .opt-text{flex:1;display:flex;flex-direction:column;gap:1px}
.opt .opt-text small{font-size:.7rem;color:var(--text-muted);line-height:1.35}
.opt select{background:var(--surface-1);color:var(--text-primary);border:1px solid var(--border-strong);border-radius:6px;padding:4px 6px;font-size:.78rem;max-width:230px}
 .opt-note{font-size:.76rem;color:var(--text-muted);margin:0 0 6px;line-height:1.45}
.settings-tabs{display:flex;gap:5px;flex-wrap:wrap;position:sticky;top:-16px;z-index:2;padding:4px 0 10px;margin:-4px 0 10px;background:var(--surface-0);border-bottom:1px solid var(--border)}
.settings-tabs button{border:1px solid var(--border-strong);background:var(--surface-1);color:var(--text-secondary);border-radius:7px;padding:5px 9px;font-size:.74rem;cursor:pointer}
.settings-tabs button.active{background:var(--accent);border-color:var(--accent);color:#fff}
.model-price{font-size:.75rem;color:var(--text-secondary);margin:4px 0 8px;padding:7px 9px;background:var(--surface-2);border-radius:6px}
.settings-intro{font-size:.78rem;color:var(--text-muted);line-height:1.5;margin:0 0 10px}

.raw-text{margin:0;font-family:var(--font-mono);font-size:.8rem;line-height:1.55;white-space:pre-wrap;word-break:break-word;color:var(--text-primary)}
.attach-btn{background:none;border:none;font-size:1.05rem;cursor:pointer;color:var(--text-secondary);padding:4px 8px;border-radius:6px}
.attach-btn:hover{background:var(--surface-2);color:var(--text-primary)}
.composer-box.dragover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(217,119,87,.25)}
.acct-wrap{position:relative}
.acct-wrap>button{background:var(--surface-2);border:1px solid var(--border-strong);border-radius:20px;padding:3px 12px;font-size:.78rem;color:var(--text-primary);cursor:pointer}
.acct-wrap>button:hover{background:var(--surface-3)}
.acct-menu{position:absolute;top:calc(100% + 6px);left:0;width:340px;max-height:70vh;overflow:auto;background:var(--surface-0);border:1px solid var(--border-strong);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.18);z-index:40;padding:8px}
.acct-menu[hidden]{display:none}
.acct-item{padding:9px 10px;border-radius:8px;border:1px solid transparent;margin-bottom:4px;cursor:pointer}
.acct-item:hover{background:var(--surface-1)}
.acct-item.current{background:var(--surface-1);border-color:var(--border-strong);cursor:default}
.acct-row{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.84rem;color:var(--text-primary)}
.acct-row .acct-x{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1rem;line-height:1;padding:0 4px}
.acct-row .acct-x:hover{color:var(--danger)}
.acct-bar{height:5px;background:var(--surface-3);border-radius:3px;margin:6px 0 4px;overflow:hidden}
.acct-bar i{display:block;height:100%;background:var(--accent)}
.acct-bar i.low{background:var(--danger)}
.acct-sub{font-size:.7rem;color:var(--text-muted);display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.acct-foot{display:flex;gap:6px;border-top:1px solid var(--border);padding-top:8px;margin-top:6px}
.acct-foot button{flex:1;background:var(--surface-2);border:1px solid var(--border-strong);border-radius:6px;padding:5px 8px;font-size:.76rem;color:var(--text-primary);cursor:pointer}
.acct-foot button:hover{background:var(--surface-3)}
.acct-note{font-size:.68rem;color:var(--text-muted);padding:6px 4px 0;line-height:1.4}

.search-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;align-items:flex-start;justify-content:center;padding-top:9vh}
.search-backdrop.open{display:flex}
.search-modal{width:min(680px,94vw);max-height:78vh;background:var(--surface-0);border:1px solid var(--border-strong);border-radius:14px;box-shadow:0 16px 48px rgba(0,0,0,.28);display:flex;flex-direction:column;overflow:hidden}
.search-head{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--border)}
.search-head svg{width:16px;height:16px;flex-shrink:0;stroke:var(--text-muted);fill:none;stroke-width:1.8;stroke-linecap:round}
.search-head input{flex:1;background:transparent;border:none;outline:none;font-size:.95rem;color:var(--text-primary);font-family:var(--font-ui)}
.search-head button{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:1.1rem;padding:2px 8px;border-radius:6px}
.search-head button:hover{background:var(--surface-2);color:var(--text-primary)}
.search-results{overflow-y:auto;padding:8px}
.search-item{padding:9px 12px;border-radius:8px;cursor:pointer}
.search-item.sel,.search-item:hover{background:var(--surface-2)}
.search-item .st{display:flex;justify-content:space-between;gap:10px;font-size:.84rem;color:var(--text-primary);font-weight:500}
.search-item .st span:first-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.search-item .st .tm{font-size:.7rem;color:var(--text-muted);font-weight:400;flex-shrink:0;font-variant-numeric:tabular-nums}
.search-item .sn{font-size:.78rem;color:var(--text-secondary);margin-top:3px;line-height:1.45;white-space:pre-wrap;word-break:break-word;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.search-item mark{background:rgba(217,119,87,.28);color:inherit;border-radius:2px;padding:0 1px}
.search-empty{padding:28px;text-align:center;color:var(--text-muted);font-size:.85rem}

.hist-clear{background:none;border:none;font-size:.66rem;text-transform:uppercase;letter-spacing:.5px;color:var(--text-muted);cursor:pointer;padding:2px 6px;border-radius:4px}
.hist-clear:hover,.hist-clear.armed{color:#fff;background:var(--danger)}
.history-item{position:relative;padding-right:30px}
.hist-del{position:absolute;right:6px;top:8px;background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:.9rem;line-height:1;padding:2px 6px;border-radius:4px;opacity:0;transition:opacity .15s}
.history-item:hover .hist-del,.hist-del.armed{opacity:1}
.hist-del:hover{color:var(--danger)}
.hist-del.armed{background:var(--danger);color:#fff;font-size:.68rem}
</style>
</head>
<body>
<div class="app-layout">
  <div class="loading-banner" id="loadingBanner"><span class="spinner"></span><span id="loadingText">Connecting to Puter…</span></div>
  <div class="banner" id="banner"></div>
  <div class="main-row">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header"><div class="brand">Chat</div><button id="toggleThemeBtn" title="Toggle theme">🌓</button></div>
      <div class="sidebar-rows">
        <button class="side-row" id="newChatRow">
          <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <span>New</span><span class="shortcut">Ctrl+Shift+O</span>
        </button>
        <button class="side-row" id="searchRow">
          <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <span>Search</span><span class="shortcut">Ctrl+K</span>
        </button>
      </div>
      <div class="history-section-label" style="display:flex;justify-content:space-between;align-items:center">Chats <button id="clearHistoryBtn" class="hist-clear" title="Delete all chats">Clear all</button></div>
      <div class="history-list" id="historyList"></div>
    </aside>
    <div class="resizer" id="leftResizer" title="Drag to resize sidebar"></div>

    <div class="chat-container">
      <div class="top-bar">
        <button id="toggleSidebarBtn" title="Toggle History">☰</button>
        <div class="usage-bar" id="usageBar">
          <div class="acct-wrap" id="acctWrap">
            <button id="acctBtn" title="Switch account">👤 <span id="acctName">Account</span> ▾</button>
            <div class="acct-menu" id="acctMenu" hidden></div>
          </div>
          <span id="usageText">Usage loading…</span>
          <span id="modelUsage" title="Spend on the selected model this month. The allowance itself is one pool shared by all models."></span>
          <span id="totalUsage" title="Total tokens used across all chats">Σ <b>0</b> tok · <b>$0.000000</b></span>
          <button id="refreshUsageBtn" title="Refresh Puter quota">↻</button>
          <button id="settingsBtn" title="Settings">⚙</button>
        </div>
        <div style="display:flex;gap:4px">
          <button id="toggleLogBtn" class="hidden" title="Show code panel">Code</button>
          <button id="toggleNetLogBtn" class="hidden" title="Show network log">Log</button>
        </div>
      </div>

      <main class="chat-messages" id="chatMessages">
        <div class="welcome" id="welcome"><h1>AI Chat</h1><p>How can I help you today?</p></div>
      </main>
      <button class="scroll-helper" id="scrollHelper" title="Scroll to bottom">↓</button>

      <footer class="composer">
        <div class="attachments" id="attachments"></div>
        <div class="composer-box">
          <textarea id="chatInput" placeholder="How can I help you today?" rows="1"></textarea>
          <div class="composer-chin">
            <div class="chin-left hidden" id="modelRow">
              <select id="providerSelect" class="model-select"><option value="">Provider…</option></select>
              <select id="modelSelect" class="model-select"><option value="">Model…</option></select>
            </div>
            <div class="chin-right"><input type="file" id="fileInput" multiple hidden /><button id="attachBtn" class="attach-btn" title="Attach text / code files (or drag &amp; drop)">📎</button><button id="sendBtn" class="send-btn" disabled>Send</button></div>
          </div>
        </div>
        <div id="streamingIndicator" class="streaming">Thinking…</div>
        <div class="build-status"><span id="build" class="status-build"></span></div>
      </footer>
    </div>

    <div class="resizer" id="rightResizer" title="Drag to resize panel"></div>
    <aside class="side-panel hidden" id="sidePanel">
      <div class="side-panel-header">
        <div class="segmented" role="tablist" id="tabStrip"></div>
        <div class="side-title" id="sideTitle"></div>
        <div class="side-actions" id="sideActions">
          <button class="primary" id="copyBtn" title="Copy current tab contents">Copy</button>
          <button id="downloadBtn" title="Download file">⤓</button>
          <button id="diagnosticsBtn" title="Copy diagnostics (log + HTML)">Diag</button>
          <button class="side-close" id="closeSidePanelBtn" title="Close">×</button>
        </div>
      </div>
      <div class="side-body">
        <div class="side-tab" id="tab-preview" hidden><iframe class="preview-frame" id="previewFrame" sandbox="allow-scripts allow-same-origin allow-popups allow-forms" referrerpolicy="no-referrer"></iframe></div>
        <div class="side-tab" id="tab-code" hidden><div class="file-bar" id="fileBar" hidden></div><pre class="code-preview"><code id="codeContent"></code></pre></div>
        <div class="side-tab" id="tab-raw" hidden><div class="raw-viewer" id="rawViewer"></div></div>
        <div class="side-tab" id="tab-log" hidden><div class="log-viewer" id="logViewer"></div></div>
        <div class="side-tab" id="tab-settings" hidden><div class="settings-viewer" id="settingsViewer"></div></div>
      </div>
    </aside>
  </div>
</div>

<div class="search-backdrop" id="searchOverlay">
  <div class="search-modal" role="dialog" aria-label="Search chats">
    <div class="search-head">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="searchInput" type="search" placeholder="Search chat content..." autocomplete="off" />
      <button id="searchClose" title="Close (Esc)">×</button>
    </div>
    <div class="search-results" id="searchResults"></div>
  </div>
</div>

<div class="modal-backdrop" id="settingsModal">
  <div class="modal">
    <div class="modal-header">
      <h2>Settings</h2>
      <button class="side-close" id="closeSettingsBtn" title="Close">×</button>
    </div>
    <div class="modal-body" id="settingsModalBody"></div>
  </div>
</div>

<script>
/* ---------- HELPERS ---------- */
const esc = s => String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const num = (n, d = 2) => (typeof n === 'number' && isFinite(n)) ? n.toFixed(d) : '?';
function safeJSON(key, fallback) { try { const v = JSON.parse(localStorage.getItem(key) || 'null'); return v ?? fallback; } catch (_) { return fallback; } }

/* ---------- BUILD STAMP ---------- */
(function () {
  const KEY = 'puter-build-meta';
  const prev = safeJSON(KEY, null);
  let stamp, version = null, note = null, clockWorks = false;
  try {
    const now = new Date();
    if (now.getFullYear() < 2020) throw new Error('clock suspicious');
    const pad = n => String(n).padStart(2, '0');
    stamp = `${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    clockWorks = true;
  } catch (e) {
    stamp = 'unknown';
    version = (prev && prev.version ? prev.version : 0) + 1;
    note = 'No clock access — version bumped.';
  }
  try { localStorage.setItem(KEY, JSON.stringify({ stamp, version, note, clockWorks })); } catch (_) {}
  document.addEventListener('DOMContentLoaded', () => {
    const el = document.getElementById('build');
    if (el) el.textContent = clockWorks ? `Build ${stamp}` : `Build ${stamp} · v${version} (${note})`;
  });
})();

/* ---------- SETTINGS (persisted) ---------- */
const DEFAULT_SETTINGS = {
  // Debug logging
  debugEnabled: true,
  logNetwork: true,      // fetch / XHR / WebSocket
  logSdk: true,          // puter.* SDK calls
  logStreamChunks: true, // every streamed chunk (SDK + network)
  logEvents: true,       // app events
  logConsole: true,      // console.* + uncaught errors + failed resource loads
  logPreview: true,      // console/errors from inside the preview iframe
  redact: true,          // mask tokens / keys / passwords
  maxEntries: 500,
  maxBody: 20000,        // chars per body/string, 0 = unlimited
  // Debug report (Copy / Diag)
  reportFormat: 'markdown',
  reportPageHTML: true,
  reportStripCode: true,
  reportPreview: true,
  reportChats: 'current',
  reportAccount: false,
  reportModels: false,
  // Behaviour
  enterToSend: true,
  autoOpenPanel: true,
  reasoningOpen: false,
  usageRefreshSec: 60,
  // Settings page sections
  showAccount: true, showQuota: true, showUsage: true, showModels: true, showRawUsage: true
};
const SETTINGS_KEY = 'puter-settings';
function loadSettings() { return Object.assign({}, DEFAULT_SETTINGS, safeJSON(SETTINGS_KEY, {})); }

/* ---------- DEBUG LOG ----------
 * One chronological log of everything the app does: network, Puter SDK calls (incl. streamed chunks),
 * app events, console output, uncaught errors and preview-iframe output. Entries are plain JSON so they
 * can be copied for an AI to debug. Always wrapped in try/catch so logging can never break the app. */
const DebugLog = {
  entries: [],
  seq: 0,
  settings: loadSettings(),
  onChange: null,
  CAT: { network: 'logNetwork', sdk: 'logSdk', event: 'logEvents', console: 'logConsole', preview: 'logPreview' },

  on(cat) { const s = this.settings; return !!s.debugEnabled && (!cat || !!s[cat]); },
  touch() { try { this.onChange && this.onChange(); } catch (_) {} },
  trim() { const max = Number(this.settings.maxEntries) || 500; while (this.entries.length > max) this.entries.shift(); },
  clear() { this.entries.length = 0; this.touch(); },

  add(type, data) {
    try {
      if (!this.on(this.CAT[type])) return null;
      const e = Object.assign({ id: ++this.seq, ts: new Date().toISOString(), t: Math.round(performance.now()), type }, data);
      this.entries.push(e);
      this.trim();
      this.touch();
      return e;
    } catch (_) { return null; }
  },
  event(name, data) { return this.add('event', { name, data: data === undefined ? undefined : this.safe(data) }); },

  /* ---- text helpers ---- */
  clip(s) {
    s = String(s ?? '');
    const max = Number(this.settings.maxBody) || 0;
    return (max > 0 && s.length > max) ? s.slice(0, max) + `…[truncated ${s.length - max} chars]` : s;
  },
  redactText(s) {
    s = String(s ?? '');
    if (!this.settings.redact) return s;
    return s
      .replace(/(authorization["']?\s*[:=]\s*["']?)(?:bearer\s+)?[^\s"',}&]+/gi, '$1[REDACTED]')
      .replace(/((?:auth[_-]?token|access[_-]?token|refresh[_-]?token|api[_-]?key|apikey|password|secret|token)["']?\s*[:=]\s*["']?)[^\s"',}&]+/gi, '$1[REDACTED]')
      .replace(/Bearer\s+[A-Za-z0-9._~+\/\-]+=*/g, 'Bearer [REDACTED]');
  },
  txt(s) { return this.clip(this.redactText(s)); },
  SENSITIVE_KEY: /^(authorization|auth[_-]?token|access[_-]?token|refresh[_-]?token|token|api[_-]?key|apikey|secret|password|cookie|set-cookie)$/i,

  /* JSON-safe copy of anything (errors, circular refs, DOM nodes, big strings) */
  safe(v, depth = 0, seen = new WeakSet()) {
    try {
      if (v === null || v === undefined) return v;
      const t = typeof v;
      if (t === 'string') return this.txt(v);
      if (t === 'number' || t === 'boolean') return v;
      if (t === 'bigint') return String(v) + 'n';
      if (t === 'symbol') return String(v);
      if (t === 'function') return `[Function ${v.name || 'anonymous'}]`;
      if (v instanceof Error) {
        const o = { name: v.name, message: this.txt(v.message), stack: this.txt(v.stack || '') };
        Object.keys(v).forEach(k => { o[k] = this.safe(v[k], depth + 1, seen); });
        return o;
      }
      if (typeof Node !== 'undefined' && v instanceof Node) return `[${v.nodeName}]`;
      if (typeof Blob !== 'undefined' && v instanceof Blob) return `[Blob ${v.type || 'unknown'} ${v.size} bytes]`;
      if (v instanceof ArrayBuffer || ArrayBuffer.isView(v)) return `[binary ${v.byteLength} bytes]`;
      if (depth > 6) return '[depth limit]';
      if (seen.has(v)) return '[circular]';
      seen.add(v);
      if (Array.isArray(v)) {
        const out = v.slice(0, 200).map(x => this.safe(x, depth + 1, seen));
        if (v.length > 200) out.push(`…${v.length - 200} more items`);
        return out;
      }
      const out = {};
      Object.keys(v).slice(0, 100).forEach(k => {
        out[k] = (this.settings.redact && this.SENSITIVE_KEY.test(k)) ? '[REDACTED]' : this.safe(v[k], depth + 1, seen);
      });
      return out;
    } catch (err) { return `[unserialisable: ${err && err.message}]`; }
  },
  fmtArgs(args) {
    return this.txt(Array.prototype.map.call(args, a => {
      if (typeof a === 'string') return a;
      try { return JSON.stringify(this.safe(a)); } catch (_) { return String(a); }
    }).join(' '));
  },
  bodyToString(b) {
    try {
      if (b == null) return '';
      if (typeof b === 'string') return this.txt(b);
      if (typeof URLSearchParams !== 'undefined' && b instanceof URLSearchParams) return this.txt(b.toString());
      if (typeof FormData !== 'undefined' && b instanceof FormData) {
        const o = {}; b.forEach((v, k) => { o[k] = (typeof v === 'string') ? v : `[File ${v.name || ''} ${v.size || 0} bytes]`; });
        return this.txt(JSON.stringify(this.safe(o)));
      }
      if (typeof Blob !== 'undefined' && b instanceof Blob) return `[Blob ${b.type} ${b.size} bytes]`;
      if (b instanceof ArrayBuffer || ArrayBuffer.isView(b)) return `[binary ${b.byteLength} bytes]`;
      return this.txt(JSON.stringify(this.safe(b)));
    } catch (_) { return '[unreadable body]'; }
  },
  headersToObj(h) {
    const o = {};
    try {
      if (!h) return o;
      if (typeof Headers !== 'undefined' && h instanceof Headers) h.forEach((v, k) => { o[k] = v; });
      else if (Array.isArray(h)) h.forEach(([k, v]) => { o[k] = v; });
      else Object.keys(h).forEach(k => { o[k] = h[k]; });
      Object.keys(o).forEach(k => { o[k] = (this.settings.redact && this.SENSITIVE_KEY.test(k)) ? '[REDACTED]' : this.txt(o[k]); });
    } catch (_) {}
    return o;
  },

  /* Read a (cloned) response body in the background so streaming responses are logged too. */
  captureBody(res, e) {
    try {
      const ct = res.headers.get('content-type') || '';
      if (ct && !/json|text|xml|javascript|event-stream|ndjson|x-www-form|html|csv/i.test(ct)) { e.resBody = `(non-text body: ${ct}; not logged)`; return; }
      const streaming = /event-stream|ndjson/i.test(ct);
      if (streaming && !this.settings.logStreamChunks) { e.resBody = '(streaming body not logged — enable "Streaming chunks" in Settings)'; return; }
      const clone = res.clone();
      if (!clone.body) return;
      const reader = clone.body.getReader(), dec = new TextDecoder();
      let acc = '';
      (async () => {
        try {
          for (;;) {
            const { done, value } = await reader.read();
            if (done) break;
            acc += dec.decode(value, { stream: true });
            const max = Number(this.settings.maxBody) || 0;
            e.resBody = this.txt(acc);
            if (max > 0 && acc.length > max) { try { await reader.cancel(); } catch (_) {} break; }
            if (streaming) this.touch();
          }
        } catch (err) { e.resBodyError = String(err); }
        e.resBody = this.txt(acc);
        e.bodyComplete = true;
        this.touch();
      })();
    } catch (_) {}
  },

  /* Wrap an async-iterable (streaming) SDK response so every chunk + the assembled result is logged. */
  wrapStream(res, e, t0) {
    const self = this;
    let text = '', reasoning = '', usage = null, n = 0;
    const finish = (status, extra) => {
      if (!e) return;
      e.ms = Math.round(performance.now() - t0);
      e.status = status; e.chunkCount = n;
      e.assembledText = self.txt(text);
      if (reasoning) e.assembledReasoning = self.txt(reasoning);
      if (usage) e.usage = self.safe(usage);
      if (extra) Object.assign(e, extra);
      self.touch();
    };
    return {
      [Symbol.asyncIterator]() {
        const it = res[Symbol.asyncIterator]();
        return {
          async next(v) {
            try {
              const r = await it.next(v);
              if (r.done) { finish('ok'); return r; }
              n++;
              const p = r.value;
              if (p && typeof p === 'object') {
                if (typeof p.text === 'string') text += p.text;
                const th = p.reasoning || p.thinking;
                if (typeof th === 'string') reasoning += th;
                if (p.usage) usage = p.usage;
              }
              if (e) {
                e.chunkCount = n;
                if (self.settings.logStreamChunks && n <= 5000) (e.chunks || (e.chunks = [])).push(self.safe(p));
                self.touch();
              }
              return r;
            } catch (err) { finish('error', { error: self.safe(err) }); throw err; }
          },
          async return(v) { finish('closed'); return it.return ? it.return(v) : { done: true, value: v }; },
          async throw(err) { finish('error', { error: self.safe(err) }); if (it.throw) return it.throw(err); throw err; }
        };
      }
    };
  },

  /* Wrap one puter.* method. Logs args, result / error, duration and streamed chunks. */
  wrapSdk(obj, name, label) {
    const orig = obj && obj[name];
    if (typeof orig !== 'function' || orig.__dbgWrapped) return;
    const self = this;
    const wrapped = function (...args) {
      if (!self.on('logSdk')) return orig.apply(this, args);
      const t0 = performance.now();
      const e = self.add('sdk', { name: label, args: self.safe(args), status: 'pending', ms: null });
      const done = patch => { if (e) { e.ms = Math.round(performance.now() - t0); Object.assign(e, patch); self.touch(); } };
      let ret;
      try { ret = orig.apply(this, args); }
      catch (err) { done({ status: 'error', error: self.safe(err) }); throw err; }
      const isIter = x => x && typeof x[Symbol.asyncIterator] === 'function';
      if (ret && typeof ret.then === 'function') {
        return ret.then(res => {
          if (isIter(res)) return self.wrapStream(res, e, t0);
          done({ status: 'ok', result: self.safe(res) });
          return res;
        }, err => { done({ status: 'error', error: self.safe(err) }); throw err; });
      }
      if (isIter(ret)) return self.wrapStream(ret, e, t0);
      done({ status: 'ok', result: self.safe(ret) });
      return ret;
    };
    wrapped.__dbgWrapped = true;
    try { obj[name] = wrapped; } catch (_) {}
  },

  /* Human/AI-readable text rendering of entries */
  formatEntry(e) {
    const j = v => (v === undefined || v === null || v === '') ? '' : (typeof v === 'string' ? v : JSON.stringify(v, null, 2));
    const ind = s => String(s).split('\n').map(l => '    ' + l).join('\n');
    const head = `[${e.ts}] #${e.id} `;
    let s = '';
    if (e.type === 'network') {
      s = `${head}NETWORK ${e.kind || ''} ${e.method || ''} ${e.url} → ${e.status ?? (e.pending === false ? '?' : 'pending')}${e.ms != null ? ` (${e.ms}ms)` : ''}${e.error ? ` ERROR: ${e.error}` : ''}`;
      if (e.reqHeaders && Object.keys(e.reqHeaders).length) s += `\n  request headers:\n${ind(j(e.reqHeaders))}`;
      if (e.reqBody) s += `\n  request body:\n${ind(e.reqBody)}`;
      if (e.resHeaders && Object.keys(e.resHeaders).length) s += `\n  response headers:\n${ind(j(e.resHeaders))}`;
      if (e.resBody) s += `\n  response body:\n${ind(e.resBody)}`;
      if (e.messages && e.messages.length) s += `\n  messages:\n${ind(j(e.messages))}`;
    } else if (e.type === 'sdk') {
      s = `${head}SDK ${e.name} → ${e.status}${e.ms != null ? ` (${e.ms}ms)` : ''}${e.chunkCount != null ? `, ${e.chunkCount} chunks` : ''}`;
      if (e.args !== undefined) s += `\n  args:\n${ind(j(e.args))}`;
      if (e.result !== undefined) s += `\n  result:\n${ind(j(e.result))}`;
      if (e.assembledReasoning) s += `\n  assembled reasoning:\n${ind(e.assembledReasoning)}`;
      if (e.assembledText) s += `\n  assembled text:\n${ind(e.assembledText)}`;

function providerLabel(p) {

function inferProvider(id) {
  const s = String(id || '').toLowerCase();
  if (s.startsWith('claude') || s.startsWith('infron:anthropic') || s.startsWith('openrouter:anthropic')) return 'anthropic';

  if (s.startsWith('qwen') || s.includes('/qwen')) return 'alibaba';
  if (s.startsWith('glm') || s.includes('/z-ai') || s.includes('/zhipu') || s.startsWith('zhipu')) return 'zhipu';
  if (s.startsWith('kimi') || s.includes('/moonshot')) return 'moonshot';
  if (s.startsWith('minimax') || s.includes('/minimax')) return 'minimax';
  if (s.startsWith('llama') || s.startsWith('meta-llama') || s.includes('/meta')) return 'meta';
  if (s.startsWith('mistral') || s.includes('/mistral')) return 'mistral';
  if (s.startsWith('grok') || s.includes('/x-ai')) return 'xai';
  if (s.startsWith('command') || s.includes('/cohere')) return 'cohere';
  if (s.startsWith('nova') || s.includes('/amazon')) return 'amazon';
  if (s.startsWith('sonar') || s.includes('/perplexity')) return 'perplexity';
  if (s.includes('openrouter')) return 'openrouter';
  if (s.includes('infron')) return 'infron';
  if (s.includes('togetherai') || s.includes('together')) return 'togetherai';
  if (s.includes('seed') || s.includes('bytedance')) return 'bytedance';

/* ---------- USAGE NORMALISER ----------
 * Shapes seen from Puter:
 *   A) prompt_tokens / completion_tokens / cached_tokens / usd_cents / cost   (OpenAI-style)
 *   B) input_tokens / output_tokens / cache_read_input_tokens / thinking_tokens / usd_cents / cost (Anthropic-style)
 * usd_cents = US cents. cost = internal units: cost = usd_cents*1.6e6, and quota credits = usd_cents*32 = cost/50000.
 */
function normaliseUsage(u) {
  if (!u || typeof u !== 'object') return null;
  const inTok = u.prompt_tokens ?? u.input_tokens ?? 0;
  const outTok = u.completion_tokens ?? u.output_tokens ?? 0;
  const cachedTok = u.cached_tokens ?? u.cache_read_input_tokens ?? 0;
  const thinkingTok = u.thinking_tokens ?? 0;
  let usd = null, credits = null;
  if (typeof u.usd_cents === 'number') { usd = u.usd_cents / 100; credits = u.usd_cents * 32; }
  else if (typeof u.cost === 'number') { usd = u.cost / 1.6e8; credits = u.cost / 50000; }
  return { inTok, outTok, cachedTok, thinkingTok, usd, credits, raw: u };
}

      inp.addEventListener('input', () => this.renderSearch());
      inp.addEventListener('keydown', e => {
        const items = [...this.$('searchResults').querySelectorAll('.search-item')];
        if (e.key === 'Escape') { this.closeSearch(); }
        else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
          e.preventDefault(); if (!items.length) return;
          this._searchSel = (this._searchSel + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length;
          items.forEach((el, i) => el.classList.toggle('sel', i === this._searchSel));
          items[this._searchSel].scrollIntoView({ block: 'nearest' });
        } else if (e.key === 'Enter') { e.preventDefault(); items[this._searchSel]?.click(); }

      ov.addEventListener('mousedown', e => { if (e.target === ov) this.closeSearch(); });
